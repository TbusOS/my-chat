<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP 万能插座 — AI 的即插即用接口</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: #ffffff;
  color: #1e293b;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* Header */
.header {
  text-align: center;
  padding: 32px 20px 16px;
}

.header h1 {
  font-size: 32px;
  font-weight: 900;
  color: #1e293b;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.header h1 span {
  color: #2563eb;
}

.header p {
  font-size: 16px;
  color: #64748b;
  font-weight: 400;
}

/* Progress Bar */
.progress-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 16px 0 8px;
}

.progress-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #e2e8f0;
  transition: all 0.4s ease;
  cursor: pointer;
}

.progress-dot.active {
  background: #2563eb;
  transform: scale(1.3);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
}

.progress-dot.completed {
  background: #2563eb;
}

.progress-line {
  width: 24px;
  height: 2px;
  background: #e2e8f0;
  transition: background 0.4s ease;
}

.progress-line.completed {
  background: #2563eb;
}

.step-label {
  font-size: 14px;
  color: #94a3b8;
  font-weight: 500;
  margin-top: 6px;
}

.step-label strong {
  color: #2563eb;
}

/* Stage */
.stage-container {
  position: relative;
  width: 680px;
  height: 440px;
  margin: 12px 0 16px;
  background: #f8fafc;
  border-radius: 20px;
  border: 2px solid #e2e8f0;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.04);
}

.stage {
  position: relative;
  width: 100%;
  height: 100%;
}

/* Step title inside stage */
.step-title {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 15px;
  font-weight: 700;
  color: #2563eb;
  background: #eff6ff;
  padding: 4px 18px;
  border-radius: 20px;
  z-index: 20;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.step-title.visible {
  opacity: 1;
}

/* Character */
.character-wrapper {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  transition: left 0.8s ease, transform 0.8s ease, bottom 0.8s ease;
}

.character-wrapper.idle {
  animation: bobbing 2s ease-in-out infinite;
}

.character-wrapper.nod {
  animation: nod 0.5s ease-in-out 2;
}

.character-wrapper.thinking {
  animation: thinking-bob 2.5s ease-in-out infinite;
}

.character-wrapper.eureka {
  animation: eureka 0.6s ease-out;
}

.character-wrapper.celebrate {
  animation: celebrate 0.5s ease-in-out 3;
}

.character-wrapper.sad {
  animation: sad-shake 1.5s ease-in-out infinite;
}

.character-wrapper.powerup {
  animation: powerup-glow 0.8s ease-out;
}

.character-wrapper.proud {
  animation: proud-bounce 0.6s ease-in-out 2;
}

.character-wrapper.pos-right {
  left: 62%;
}

.character-wrapper.pos-center {
  left: 50%;
}

.character-wrapper.pos-left {
  left: 40%;
}

.character-wrapper.pos-hub {
  left: 50%;
  bottom: 160px;
}

@keyframes bobbing {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-6px); }
}

@keyframes nod {
  0%, 100% { transform: translateX(-50%) rotate(0deg); }
  30% { transform: translateX(-50%) rotate(8deg); }
  60% { transform: translateX(-50%) rotate(-4deg); }
}

@keyframes thinking-bob {
  0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  30% { transform: translateX(-50%) translateY(-4px) rotate(-2deg); }
  70% { transform: translateX(-50%) translateY(-2px) rotate(2deg); }
}

@keyframes eureka {
  0% { transform: translateX(-50%) translateY(0) scale(1); }
  40% { transform: translateX(-50%) translateY(-20px) scale(1.1); }
  100% { transform: translateX(-50%) translateY(0) scale(1); }
}

@keyframes celebrate {
  0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  25% { transform: translateX(-50%) translateY(-15px) rotate(-8deg); }
  75% { transform: translateX(-50%) translateY(-15px) rotate(8deg); }
}

@keyframes sad-shake {
  0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  25% { transform: translateX(-50%) translateY(2px) rotate(-3deg); }
  75% { transform: translateX(-50%) translateY(2px) rotate(3deg); }
}

@keyframes powerup-glow {
  0% { transform: translateX(-50%) scale(1); filter: brightness(1); }
  50% { transform: translateX(-50%) scale(1.15); filter: brightness(1.4) drop-shadow(0 0 20px rgba(37, 99, 235, 0.6)); }
  100% { transform: translateX(-50%) scale(1); filter: brightness(1); }
}

@keyframes proud-bounce {
  0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
  50% { transform: translateX(-50%) translateY(-10px) scale(1.05); }
}

/* Character SVG parts */
.char-arm-left, .char-arm-right {
  transition: transform 0.4s ease;
  transform-origin: center top;
}

.character-wrapper.wave .char-arm-right {
  animation: wave-arm 0.6s ease-in-out 2;
}

.character-wrapper.reach .char-arm-right {
  transform: rotate(-60deg) translateX(5px);
}

.character-wrapper.reach-left .char-arm-left {
  transform: rotate(60deg) translateX(-5px);
}

.character-wrapper.point .char-arm-right {
  transform: rotate(-45deg) translateX(10px) translateY(-10px);
}

.character-wrapper.chin .char-arm-right {
  transform: rotate(-70deg) translateX(2px) translateY(-15px);
}

.character-wrapper.present .char-arm-left,
.character-wrapper.present .char-arm-right {
  transform: rotate(-40deg);
}

.character-wrapper.arms-up .char-arm-left {
  transform: rotate(40deg);
}

.character-wrapper.arms-up .char-arm-right {
  transform: rotate(-40deg);
}

@keyframes wave-arm {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-40deg); }
}

/* Character eyes */
.char-eye {
  transition: all 0.3s ease;
}

.character-wrapper.look-left .char-eye {
  transform: translateX(-2px);
}

/* Character mouth */
.char-mouth {
  transition: all 0.3s ease;
}

.character-wrapper.surprise .char-mouth {
  rx: 4;
  ry: 4;
}

/* Lightbulb */
.lightbulb {
  position: absolute;
  top: -45px;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0;
  transition: opacity 0.5s ease;
}

.lightbulb.on {
  opacity: 1;
  animation: glow-pulse 1.5s ease-in-out infinite;
}

@keyframes glow-pulse {
  0%, 100% { filter: drop-shadow(0 0 4px rgba(250, 204, 21, 0.4)); }
  50% { filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.8)); }
}

/* Exclamation */
.exclamation {
  position: absolute;
  top: -40px;
  right: -30px;
  font-size: 32px;
  font-weight: 900;
  color: #ef4444;
  opacity: 0;
  transform: scale(0);
  transition: all 0.3s ease;
}

.exclamation.visible {
  opacity: 1;
  transform: scale(1);
  animation: exclaim-pop 0.5s ease-out;
}

@keyframes exclaim-pop {
  0% { transform: scale(0) rotate(-20deg); }
  60% { transform: scale(1.3) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* Speech Bubbles */
.bubble {
  position: absolute;
  background: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: 16px;
  padding: 12px 18px;
  font-size: 14px;
  line-height: 1.6;
  color: #334155;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  opacity: 0;
  transform: scale(0.8) translateY(10px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
  max-width: 240px;
}

.bubble.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.bubble::after {
  content: '';
  position: absolute;
  width: 0;
  height: 0;
}

.bubble.tail-right::after {
  bottom: 20px;
  right: -10px;
  border-left: 10px solid #ffffff;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.bubble.tail-left::after {
  bottom: 20px;
  left: -10px;
  border-right: 10px solid #ffffff;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.bubble.tail-bottom::after {
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border-top: 10px solid #ffffff;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
}

/* Service icons */
.service-icon {
  position: absolute;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 8;
  opacity: 0;
  transform: scale(0);
}

.service-icon.visible {
  opacity: 1;
  transform: scale(1);
}

.service-icon .icon-circle {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  position: relative;
  transition: all 0.5s ease;
  border: 3px solid #d1d5db;
  background: #f1f5f9;
}

.service-icon.locked .icon-circle {
  filter: grayscale(0.8) opacity(0.6);
  background: #e2e8f0;
  border-color: #cbd5e1;
}

.service-icon.unlocked .icon-circle {
  filter: none;
  background: #ffffff;
  border-color: #2563eb;
  box-shadow: 0 0 16px rgba(37, 99, 235, 0.25);
  animation: icon-unlock 0.6s ease-out;
}

.service-icon .lock-badge {
  position: absolute;
  bottom: -4px;
  right: -4px;
  font-size: 14px;
  transition: all 0.3s ease;
}

.service-icon.unlocked .lock-badge {
  opacity: 0;
  transform: scale(0);
}

.service-icon .icon-label {
  font-size: 12px;
  font-weight: 600;
  color: #94a3b8;
  transition: color 0.5s ease;
}

.service-icon.unlocked .icon-label {
  color: #2563eb;
}

@keyframes icon-unlock {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); box-shadow: 0 0 24px rgba(37, 99, 235, 0.5); }
  100% { transform: scale(1); }
}

/* Connection lines */
.connection-line {
  position: absolute;
  z-index: 6;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.connection-line.visible {
  opacity: 1;
}

.connection-line line {
  stroke: #2563eb;
  stroke-width: 2;
  stroke-dasharray: 8 4;
  animation: dash-flow 1s linear infinite;
}

@keyframes dash-flow {
  0% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: -12; }
}

/* MCP Badge */
.mcp-badge {
  position: absolute;
  z-index: 25;
  opacity: 0;
  transition: all 0.5s ease;
}

.mcp-badge.visible {
  opacity: 1;
}

.mcp-badge .badge-inner {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: white;
  font-size: 20px;
  font-weight: 900;
  padding: 10px 22px;
  border-radius: 30px;
  box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
  letter-spacing: 2px;
}

@keyframes badge-descend {
  0% { transform: translateY(-80px) scale(0.5); opacity: 0; }
  60% { transform: translateY(10px) scale(1.1); opacity: 1; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

@keyframes badge-flash {
  0%, 100% { box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4); }
  50% { box-shadow: 0 4px 40px rgba(37, 99, 235, 0.8), 0 0 60px rgba(124, 58, 237, 0.4); }
}

/* Glow ports on character */
.glow-port {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #2563eb;
  box-shadow: 0 0 8px rgba(37, 99, 235, 0.8);
  opacity: 0;
  transition: opacity 0.4s ease;
  z-index: 11;
}

.glow-port.visible {
  opacity: 1;
  animation: port-pulse 1.5s ease-in-out infinite;
}

@keyframes port-pulse {
  0%, 100% { box-shadow: 0 0 4px rgba(37, 99, 235, 0.6); }
  50% { box-shadow: 0 0 12px rgba(37, 99, 235, 1); }
}

/* Result mini-panel */
.result-mini {
  position: absolute;
  background: #ffffff;
  border: 2px solid #22c55e;
  border-radius: 10px;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 600;
  color: #16a34a;
  box-shadow: 0 4px 12px rgba(34, 197, 94, 0.15);
  opacity: 0;
  transform: scale(0.7) translateY(5px);
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 16;
  white-space: nowrap;
}

.result-mini.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

/* MCP label */
.mcp-label {
  position: absolute;
  font-size: 13px;
  font-weight: 600;
  color: #7c3aed;
  background: rgba(124, 58, 237, 0.08);
  padding: 3px 12px;
  border-radius: 12px;
  opacity: 0;
  transition: all 0.5s ease;
  z-index: 16;
  white-space: nowrap;
}

.mcp-label.visible {
  opacity: 1;
}

/* Summary panel */
.summary-panel {
  position: absolute;
  background: #ffffff;
  border: 3px solid #2563eb;
  border-radius: 20px;
  padding: 0;
  font-size: 18px;
  line-height: 1.9;
  box-shadow: 0 8px 32px rgba(37, 99, 235, 0.12);
  opacity: 0;
  transform: scale(0.5) rotate(-3deg);
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
  overflow: hidden;
}

.summary-panel.visible {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.summary-header {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: white;
  padding: 14px 28px;
  font-weight: 700;
  font-size: 22px;
}

.summary-body {
  padding: 20px 28px;
}

.summary-item {
  opacity: 0;
  transform: translateX(-8px);
  transition: all 0.4s ease;
  padding: 2px 0;
}

.summary-item.visible {
  opacity: 1;
  transform: translateX(0);
}

/* Insight text */
.insight-text {
  position: absolute;
  font-size: 14px;
  font-weight: 700;
  color: #7c3aed;
  background: rgba(124, 58, 237, 0.06);
  padding: 6px 16px;
  border-radius: 12px;
  border: 1px dashed #7c3aed;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 16;
  white-space: nowrap;
}

.insight-text.visible {
  opacity: 1;
  transform: scale(1);
}

/* User query bubble */
.user-query {
  position: absolute;
  background: #eff6ff;
  border: 2px solid #bfdbfe;
  border-radius: 16px;
  padding: 10px 16px;
  font-size: 13px;
  color: #1e40af;
  font-weight: 500;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
  opacity: 0;
  transform: scale(0.8) translateY(10px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 16;
  max-width: 220px;
}

.user-query.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.user-query::before {
  content: '👤';
  margin-right: 6px;
}

/* Confetti */
.confetti-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 30;
  overflow: hidden;
}

.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  opacity: 0;
}

.confetti.active {
  animation: confetti-fall 2s ease-out forwards;
}

@keyframes confetti-fall {
  0% { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translateY(400px) rotate(720deg) scale(0.5); }
}

/* Controls */
.controls {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 8px 0 32px;
}

.btn {
  padding: 10px 24px;
  border: none;
  border-radius: 10px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(0);
}

.btn-primary {
  background: #2563eb;
  color: white;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
}

.btn-primary:hover {
  background: #1d4ed8;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
}

.btn-primary:disabled {
  background: #94a3b8;
  box-shadow: none;
  cursor: not-allowed;
  transform: none;
}

.btn-secondary {
  background: #f1f5f9;
  color: #475569;
  border: 1px solid #e2e8f0;
}

.btn-secondary:hover {
  background: #e2e8f0;
}

.btn-auto {
  background: #f0fdf4;
  color: #16a34a;
  border: 1px solid #bbf7d0;
}

.btn-auto:hover {
  background: #dcfce7;
}

.btn-auto.playing {
  background: #fef2f2;
  color: #dc2626;
  border-color: #fecaca;
}

.btn-step {
  background: #fffbeb;
  color: #d97706;
  border: 1px solid #fde68a;
}

.btn-step:hover {
  background: #fef3c7;
}

.btn-step:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Ground shadow */
.ground-shadow {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 8px;
  background: radial-gradient(ellipse, rgba(0,0,0,0.08) 0%, transparent 70%);
  z-index: 5;
  transition: left 0.8s ease, bottom 0.8s ease;
}

/* Responsive */
@media (max-width: 720px) {
  .stage-container {
    width: 95vw;
    height: 380px;
  }
  .header h1 { font-size: 24px; }
  .bubble, .summary-panel { font-size: 12px; max-width: 180px; }
  .service-icon .icon-circle { width: 44px; height: 44px; font-size: 20px; }
}
</style>
</head>
<body>

<div class="header">
  <h1><span>MCP 万能插座</span> — AI 的即插即用接口</h1>
  <p>一个协议，让 AI 连接一切外部服务</p>
</div>

<div class="progress-bar" id="progressBar">
  <div class="progress-dot active" data-step="0" onclick="goToStep(0)"></div>
  <div class="progress-line" data-line="0"></div>
  <div class="progress-dot" data-step="1" onclick="goToStep(1)"></div>
  <div class="progress-line" data-line="1"></div>
  <div class="progress-dot" data-step="2" onclick="goToStep(2)"></div>
  <div class="progress-line" data-line="2"></div>
  <div class="progress-dot" data-step="3" onclick="goToStep(3)"></div>
  <div class="progress-line" data-line="3"></div>
  <div class="progress-dot" data-step="4" onclick="goToStep(4)"></div>
  <div class="progress-line" data-line="4"></div>
  <div class="progress-dot" data-step="5" onclick="goToStep(5)"></div>
</div>
<div class="step-label" id="stepLabel">步骤 <strong>1</strong> / 6</div>

<div class="stage-container">
  <div class="stage" id="stage">
    <div class="step-title" id="stepTitle"></div>

    <!-- Ground shadow -->
    <div class="ground-shadow" id="groundShadow"></div>

    <!-- Character -->
    <div class="character-wrapper idle" id="character">
      <!-- Lightbulb above head -->
      <div class="lightbulb" id="lightbulb">
        <svg width="30" height="36" viewBox="0 0 30 36">
          <ellipse cx="15" cy="14" rx="11" ry="12" fill="#fbbf24" opacity="0.3"/>
          <path d="M15 2 C8 2 3 7.5 3 14 C3 19 6 22 9 24 L9 28 L21 28 L21 24 C24 22 27 19 27 14 C27 7.5 22 2 15 2Z" fill="#fbbf24"/>
          <rect x="10" y="28" width="10" height="3" rx="1" fill="#d4a017"/>
          <rect x="11" y="31" width="8" height="2" rx="1" fill="#d4a017"/>
          <path d="M15 8 L15 18 M10 13 L20 13" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        </svg>
      </div>

      <!-- Exclamation mark -->
      <div class="exclamation" id="exclamation">!</div>

      <!-- SVG Character -->
      <svg width="100" height="140" viewBox="0 0 100 140" id="charSvg">
        <!-- Body -->
        <rect class="char-body" x="30" y="62" width="40" height="45" rx="12" fill="#2563eb"/>

        <!-- Legs -->
        <rect x="35" y="102" width="12" height="22" rx="6" fill="#1d4ed8"/>
        <rect x="53" y="102" width="12" height="22" rx="6" fill="#1d4ed8"/>

        <!-- Shoes -->

function clearDynamic() {
  dynamicElements.forEach(el => {
    if (el && el.parentNode) el.parentNode.removeChild(el);
  });
  dynamicElements = [];
  serviceIconEls = [];

  character.className = 'character-wrapper idle pos-center';

  lightbulb.classList.remove('on');
  exclamation.classList.remove('visible');
  confettiContainer.innerHTML = '';
  lineLayer.innerHTML = '';
}

function createElement(tag, attrs, parent) {
  const el = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(k => {
      if (k === 'style' && typeof attrs[k] === 'object') {
        Object.assign(el.style, attrs[k]);
      } else if (k === 'className') {
        el.className = attrs[k];
      } else if (k === 'innerHTML') {
        el.innerHTML = attrs[k];
      } else if (k === 'textContent') {
        el.textContent = attrs[k];
      } else {
        el.setAttribute(k, attrs[k]);
      }
    });
  }
  (parent || stage).appendChild(el);
  dynamicElements.push(el);
  return el;
}

function createSVGLine(x1, y1, x2, y2) {
  const ns = 'http://www.w3.org/2000/svg';
  const g = document.createElementNS(ns, 'g');
  g.style.opacity = '0';
  g.style.transition = 'opacity 0.5s ease';

  const line = document.createElementNS(ns, 'line');
  line.setAttribute('x1', x1);
  line.setAttribute('y1', y1);
  line.setAttribute('x2', x2);
  line.setAttribute('y2', y2);
  line.setAttribute('stroke', '#2563eb');
  line.setAttribute('stroke-width', '2.5');
  line.setAttribute('stroke-dasharray', '8 4');
  line.style.animation = 'dash-flow 1s linear infinite';

  /* Glow pulse circle at end */
  const pulse = document.createElementNS(ns, 'circle');
  pulse.setAttribute('cx', x2);
  pulse.setAttribute('cy', y2);
  pulse.setAttribute('r', '4');
  pulse.setAttribute('fill', '#2563eb');
  pulse.style.animation = 'port-pulse 1.5s ease-in-out infinite';

  g.appendChild(line);
  g.appendChild(pulse);
  lineLayer.appendChild(g);
  dynamicElements.push(g);
  return g;
}

function delay(ms) {
  return new Promise(function(resolve) {
    pendingResolve = resolve;
    if (playMode === 'auto') {
      delayTimer = setTimeout(function() { pendingResolve = null; resolve(); }, ms);
    }
  });
}

function resolveCurrentDelay() {
  if (delayTimer) { clearTimeout(delayTimer); delayTimer = null; }
  if (pendingResolve) { var r = pendingResolve; pendingResolve = null; r(); }
}

function abandonCurrentStep() {
  if (delayTimer) { clearTimeout(delayTimer); delayTimer = null; }
  pendingResolve = null;
  stepRunning = false;
}

function updateProgress(step) {
  document.querySelectorAll('.progress-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === step);
    dot.classList.toggle('completed', i < step);
  });
  document.querySelectorAll('.progress-line').forEach((line, i) => {
    line.classList.toggle('completed', i < step);
  });
  document.getElementById('stepLabel').innerHTML = `步骤 <strong>${step + 1}</strong> / 6`;
}

function createServiceIcon(def, locked) {
  const el = createElement('div', {
    className: 'service-icon ' + (locked ? 'locked' : ''),
    style: { left: def.x + 'px', top: def.y + 'px' },
    innerHTML: `
      <div class="icon-circle">

        <span class="lock-badge">${locked ? '\u{1F512}' : ''}</span>
      </div>
      <span class="icon-label">${def.label}</span>
    `
  });
  serviceIconEls.push({ el, def });
  return el;
}

/* Character center position for line drawing */
function charCenter() {
  /* Character is at left:50%, bottom:40px. SVG is 100x140.
     The body center is roughly at 50,80 within SVG = stage center x, stage.height - 40 - 140 + 80 */
  const cEl = character;
  const rect = cEl.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  return {
    x: rect.left - stageRect.left + rect.width / 2,
    y: rect.top - stageRect.top + rect.height * 0.4
  };
}

function iconCenter(def) {
  return { x: def.x + 28, y: def.y + 28 };
}

  const summary = createElement('div', {

    innerHTML: `
      <div class="summary-header">\u{1F50C} MCP \u2014 AI \u4E16\u754C\u7684 USB \u63A5\u53E3</div>
      <div class="summary-body">
        <div class="summary-item" data-idx="0">\u{1F310} \u4E00\u4E2A\u6807\u51C6\u534F\u8BAE\uFF0C\u8FDE\u63A5\u6240\u6709\u670D\u52A1</div>
        <div class="summary-item" data-idx="1">\u{1F527} \u5373\u63D2\u5373\u7528\uFF0C\u65E0\u9700\u91CD\u65B0\u8BAD\u7EC3\u6A21\u578B</div>

function spawnConfetti() {
  const colors = ['#2563eb', '#22c55e', '#eab308', '#ef4444', '#a855f7', '#f97316'];
  for (let i = 0; i < 40; i++) {
    const confetti = document.createElement('div');

    confetti.style.top = '-10px';
    confetti.style.width = (4 + Math.random() * 6) + 'px';
    confetti.style.height = (4 + Math.random() * 6) + 'px';
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    confetti.style.animationDelay = (Math.random() * 0.8) + 's';
    confetti.style.animationDuration = (1.5 + Math.random() * 1) + 's';
    confettiContainer.appendChild(confetti);
    setTimeout(() => confetti.classList.add('active'), 10);
  }
}

/* ===== Navigation ===== */
const stepFunctions = [stepIsolated, stepMCPArrives, stepConnectDB, stepConnectMore, stepPlugAndPlay, stepMeaning];

async function goToStep(step) {
  if (step < 0 || step > MAX_STEP) return;
  abandonCurrentStep();
  currentStep = step;
  clearDynamic();
  updateProgress(step);
  updateControlUI();
  stepRunning = true;
  await stepFunctions[step]();
  stepRunning = false;
  if (playMode === 'auto' && currentStep === step && currentStep < MAX_STEP) {
    delayTimer = setTimeout(() => { delayTimer = null; if (playMode === 'auto') goToStep(step + 1); }, 1500);
  }
  if (playMode === 'auto' && currentStep >= MAX_STEP) { playMode = 'idle'; }
  updateControlUI();
}

function singleStep() {
  if (playMode === 'auto') { playMode = 'paused'; if (delayTimer) { clearTimeout(delayTimer); delayTimer = null; } }
  if (playMode !== 'paused') playMode = 'paused';
  if (pendingResolve) { resolveCurrentDelay(); }
  else if (currentStep < 0) { goToStep(0); }
  else if (!stepRunning && currentStep < MAX_STEP) { goToStep(currentStep + 1); }
  updateControlUI();
}

function nextStep() {
  if (currentStep >= MAX_STEP) return;
  if (playMode === 'auto') playMode = 'paused';
  goToStep(currentStep < 0 ? 0 : currentStep + 1);
}

function prevStep() {
  if (currentStep <= 0) return;
  if (playMode === 'auto') playMode = 'paused';
  goToStep(currentStep - 1);
}

function toggleAutoPlay() {
  if (playMode === 'auto') {
    playMode = 'paused';
    if (delayTimer) { clearTimeout(delayTimer); delayTimer = null; }
  } else {
    playMode = 'auto';
    if (pendingResolve) { resolveCurrentDelay(); }
    else if (currentStep < 0) { goToStep(0); }
    else if (currentStep >= MAX_STEP) { currentStep = -1; clearDynamic(); updateProgress(0); goToStep(0); }
    else if (!stepRunning) { goToStep(currentStep < MAX_STEP ? currentStep + 1 : 0); }
  }
  updateControlUI();
}

function replay() {
  abandonCurrentStep();
  playMode = 'idle';
  currentStep = -1;
  clearDynamic();
  updateProgress(0);
  updateControlUI();
  goToStep(0);
}

function updateControlUI() {
  var btnAuto = document.getElementById('btnAuto');
  var btnStep = document.getElementById('btnStep');
  var btnNext = document.getElementById('btnNext');
  var btnPrev = document.getElementById('btnPrev');
  if (btnAuto) {
    if (playMode === 'auto') { btnAuto.textContent = '⏸ 暂停'; btnAuto.classList.add('playing'); }
    else if (playMode === 'paused') { btnAuto.textContent = '▶ 继续'; btnAuto.classList.remove('playing'); }
    else { btnAuto.textContent = '▶ 自动播放'; btnAuto.classList.remove('playing'); }
  }
  if (btnStep) btnStep.disabled = (playMode === 'auto');
  if (btnNext) { btnNext.disabled = (playMode === 'auto' || currentStep >= MAX_STEP); btnNext.textContent = currentStep < MAX_STEP ? '下一步' : '完成'; }
  if (btnPrev) btnPrev.disabled = (playMode === 'auto' || currentStep <= 0);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') { e.preventDefault(); nextStep(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
  if (e.key === ' ') { e.preventDefault(); singleStep(); }
  if (e.key === 'r' || e.key === 'R') replay();
  if (e.key === 'p' || e.key === 'P') toggleAutoPlay();
});

playMode = 'paused';
goToStep(0);
</script>
