<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 运行架构全景 — 从硬件到应用，谁在谁里面？</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: #ffffff;
  color: #1e293b;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* Header */
.header {
  text-align: center;
  padding: 32px 20px 16px;
}

.header h1 {
  font-size: 32px;
  font-weight: 900;
  color: #1e293b;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.header h1 span {
  color: #2563eb;
}

.header p {
  font-size: 16px;
  color: #64748b;
  font-weight: 400;
}

/* Progress Bar */
.progress-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 16px 0 8px;
}

.progress-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #e2e8f0;
  transition: all 0.4s ease;
  cursor: pointer;
}

.progress-dot.active {
  background: #2563eb;
  transform: scale(1.3);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
}

.progress-dot.completed {
  background: #2563eb;
}

.progress-line {
  width: 24px;
  height: 2px;
  background: #e2e8f0;
  transition: background 0.4s ease;
}

.progress-line.completed {
  background: #2563eb;
}

.step-label {
  font-size: 14px;
  color: #94a3b8;
  font-weight: 500;
  margin-top: 6px;
}

.step-label strong {
  color: #2563eb;
}

/* Stage */
.stage-container {
  position: relative;
  width: 680px;
  height: 440px;
  margin: 12px 0 16px;
  background: #f8fafc;
  border-radius: 20px;
  border: 2px solid #e2e8f0;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.04);
}

.stage {
  position: relative;
  width: 100%;
  height: 100%;
}

/* Step title inside stage */
.step-title {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 15px;
  font-weight: 700;
  color: #2563eb;
  background: #eff6ff;
  padding: 4px 18px;
  border-radius: 20px;
  z-index: 20;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.step-title.visible {
  opacity: 1;
}

/* Character */
.character-wrapper {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  transition: left 0.8s ease, transform 0.8s ease;
}

.character-wrapper.idle {
  animation: bobbing 2s ease-in-out infinite;
}

.character-wrapper.nod {
  animation: nod 0.5s ease-in-out 2;
}

.character-wrapper.thinking {
  animation: thinking-bob 2.5s ease-in-out infinite;
}

.character-wrapper.eureka {
  animation: eureka 0.6s ease-out;
}

.character-wrapper.celebrate {
  animation: celebrate 0.5s ease-in-out 3;
}

.character-wrapper.pos-right {
  left: 62%;
}

.character-wrapper.pos-center {
  left: 50%;
}

.character-wrapper.pos-left {
  left: 40%;
}

.character-wrapper.pos-far-left {
  left: 10%;
}

@keyframes bobbing {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-6px); }
}

@keyframes nod {
  0%, 100% { transform: translateX(-50%) rotate(0deg); }
  30% { transform: translateX(-50%) rotate(8deg); }
  60% { transform: translateX(-50%) rotate(-4deg); }
}

@keyframes thinking-bob {
  0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  30% { transform: translateX(-50%) translateY(-4px) rotate(-2deg); }
  70% { transform: translateX(-50%) translateY(-2px) rotate(2deg); }
}

@keyframes eureka {
  0% { transform: translateX(-50%) translateY(0) scale(1); }
  40% { transform: translateX(-50%) translateY(-20px) scale(1.1); }
  100% { transform: translateX(-50%) translateY(0) scale(1); }
}

@keyframes celebrate {
  0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  25% { transform: translateX(-50%) translateY(-15px) rotate(-8deg); }
  75% { transform: translateX(-50%) translateY(-15px) rotate(8deg); }
}

/* Character SVG parts */
.char-arm-left, .char-arm-right {
  transition: transform 0.4s ease;
  transform-origin: center top;
}

.character-wrapper.wave .char-arm-right {
  animation: wave-arm 0.6s ease-in-out 2;
}

.character-wrapper.reach .char-arm-right {
  transform: rotate(-60deg) translateX(5px);
}

.character-wrapper.point .char-arm-right {
  transform: rotate(-45deg) translateX(10px) translateY(-10px);
}

.character-wrapper.chin .char-arm-right {
  transform: rotate(-70deg) translateX(2px) translateY(-15px);
}

.character-wrapper.present .char-arm-left,
.character-wrapper.present .char-arm-right {
  transform: rotate(-40deg);
}

@keyframes wave-arm {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-40deg); }
}

/* Character eyes */
.char-eye {
  transition: all 0.3s ease;
}

.character-wrapper.look-left .char-eye {
  transform: translateX(-2px);
}

/* Character mouth */
.char-mouth {
  transition: all 0.3s ease;
}

.character-wrapper.surprise .char-mouth {
  rx: 4;
  ry: 4;
}

/* Lightbulb */
.lightbulb {
  position: absolute;
  top: -45px;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0;
  transition: opacity 0.5s ease;
}

.lightbulb.on {
  opacity: 1;
  animation: glow-pulse 1.5s ease-in-out infinite;
}

@keyframes glow-pulse {
  0%, 100% { filter: drop-shadow(0 0 4px rgba(250, 204, 21, 0.4)); }
  50% { filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.8)); }
}

/* Exclamation */
.exclamation {
  position: absolute;
  top: -40px;
  right: -30px;
  font-size: 32px;
  font-weight: 900;
  color: #ef4444;
  opacity: 0;
  transform: scale(0);
  transition: all 0.3s ease;
}

.exclamation.visible {
  opacity: 1;
  transform: scale(1);
  animation: exclaim-pop 0.5s ease-out;
}

@keyframes exclaim-pop {
  0% { transform: scale(0) rotate(-20deg); }
  60% { transform: scale(1.3) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* Speech Bubbles */
.bubble {
  position: absolute;
  background: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: 16px;
  padding: 12px 18px;
  font-size: 14px;
  line-height: 1.6;
  color: #334155;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  opacity: 0;
  transform: scale(0.8) translateY(10px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
  max-width: 240px;
}

.bubble.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.bubble::after {
  content: '';
  position: absolute;
  width: 0;
  height: 0;
}

.bubble.tail-right::after {
  bottom: 20px;
  right: -10px;
  border-left: 10px solid #ffffff;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.bubble.tail-left::after {
  bottom: 20px;
  left: -10px;
  border-right: 10px solid #ffffff;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.bubble.tail-bottom::after {
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border-top: 10px solid #ffffff;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
}

/* Thought bubble */
.thought-bubble {
  position: absolute;
  background: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: 20px;
  padding: 16px 20px;
  font-size: 13px;
  line-height: 1.8;
  color: #334155;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
}

.thought-bubble.visible {
  opacity: 1;
  transform: scale(1);
}

/* Confetti */
.confetti-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 30;
  overflow: hidden;
}

.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  opacity: 0;
}

.confetti.active {
  animation: confetti-fall 2s ease-out forwards;
}

@keyframes confetti-fall {
  0% { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translateY(400px) rotate(720deg) scale(0.5); }
}

/* Ground shadow */
.ground-shadow {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 8px;
  background: radial-gradient(ellipse, rgba(0,0,0,0.08) 0%, transparent 70%);
  z-index: 5;
  transition: left 0.8s ease;
}

/* Controls */
.controls {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 8px 0 32px;
}

.btn {
  padding: 10px 24px;
  border: none;
  border-radius: 10px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(0);
}

.btn-primary {
  background: #2563eb;
  color: white;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
}

.btn-primary:hover {
  background: #1d4ed8;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
}

.btn-primary:disabled {
  background: #94a3b8;
  box-shadow: none;
  cursor: not-allowed;
  transform: none;
}

.btn-secondary {
  background: #f1f5f9;
  color: #475569;
  border: 1px solid #e2e8f0;
}

.btn-secondary:hover {
  background: #e2e8f0;
}

.btn-auto {
  background: #f0fdf4;
  color: #16a34a;
  border: 1px solid #bbf7d0;
}

.btn-auto:hover {
  background: #dcfce7;
}

.btn-auto.playing {
  background: #fef2f2;
  color: #dc2626;
  border-color: #fecaca;
}

.btn-step {
  background: #fffbeb;
  color: #d97706;
  border: 1px solid #fde68a;
}

.btn-step:hover {
  background: #fef3c7;
}

.btn-step:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ===== Architecture-specific styles ===== */

/* Architecture layer box */
.arch-layer {
  position: absolute;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  opacity: 0;
  transform: translateY(15px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.arch-layer.visible {
  opacity: 1;
  transform: translateY(0);
}

.arch-layer.faded {
  opacity: 0.75;
  transform: scale(1);
}

.arch-layer-header {
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 700;
  color: white;
  display: flex;
  align-items: center;
  gap: 6px;
}

.arch-layer-body {
  padding: 8px 10px;
  background: #ffffff;
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
}

/* Component box inside layer */
.arch-comp {
  background: white;
  border: 1.5px solid #e2e8f0;
  border-radius: 8px;
  padding: 4px 8px;
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  color: #334155;
  transition: all 0.3s ease;
  line-height: 1.4;
}

.arch-comp.highlight {
  border-color: #2563eb;
  box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
  background: #eff6ff;
}

.arch-comp-sub {
  font-size: 10px;
  font-weight: 400;
  color: #64748b;
  display: block;
}

/* Nested box (e.g. llama.cpp inside Ollama) */
.nested-box {
  border: 2px dashed #2563eb;
  border-radius: 8px;
  padding: 4px 6px;
  background: #eff6ff;
  font-size: 10px;
  font-weight: 600;
  color: #2563eb;
  text-align: center;
}

/* Arrow between layers */
.arch-arrow {
  position: absolute;
  z-index: 12;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.arch-arrow.visible {
  opacity: 1;
}

/* Animated data flow */
@keyframes flow-down {
  0% { top: 0; opacity: 1; }
  100% { top: 100%; opacity: 0.3; }
}

@keyframes flow-up {
  0% { bottom: 0; opacity: 1; }
  100% { bottom: 100%; opacity: 0.3; }
}

@keyframes pulse-dot {
  0%, 100% { opacity: 0.3; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.2); }
}

@keyframes dash-move {
  0% { stroke-dashoffset: 20; }
  100% { stroke-dashoffset: 0; }
}

/* Data flow line with moving dot */
.flow-line {
  position: absolute;
  z-index: 13;
  pointer-events: none;
}

.flow-dot {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #2563eb;
  box-shadow: 0 0 8px rgba(37,99,235,0.6);
  z-index: 14;
  pointer-events: none;
}

/* Highlight flash for data flow */
@keyframes highlight-flash {
  0% { box-shadow: 0 0 0 0 rgba(37,99,235,0.4); }
  50% { box-shadow: 0 0 0 6px rgba(37,99,235,0.15); }
  100% { box-shadow: 0 0 0 0 rgba(37,99,235,0); }
}

.arch-comp.flash {
  animation: highlight-flash 0.6s ease-out;
}

/* Note box */
.note-box {
  position: absolute;
  background: #fffbeb;
  border: 1.5px solid #fbbf24;
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 11px;
  color: #92400e;
  font-weight: 500;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 16;
  line-height: 1.5;
}

.note-box.visible {
  opacity: 1;
  transform: scale(1);
}

/* Comparison layout */
.compare-half {
  position: absolute;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  opacity: 0;
  transform: translateY(15px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.compare-half.visible {
  opacity: 1;
  transform: translateY(0);
}

.compare-header {
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 700;
  color: white;
  text-align: center;
}

.compare-body {
  padding: 8px 10px;
  background: #ffffff;
}

.compare-item {
  font-size: 11px;
  padding: 3px 0;
  border-bottom: 1px solid #f1f5f9;
  display: flex;
  align-items: center;
  gap: 6px;
  color: #334155;
  font-weight: 500;
}

.compare-item:last-child {
  border-bottom: none;
}

.compare-label {
  font-size: 10px;
  color: #64748b;
  text-align: center;
  padding: 6px 10px;
  font-weight: 400;
  line-height: 1.4;
  background: #ffffff;
}

/* Responsive */
@media (max-width: 720px) {
  .stage-container {
    width: 95vw;
    height: 380px;
  }
  .header h1 { font-size: 24px; }
  .bubble, .thought-bubble { font-size: 12px; max-width: 180px; }
}
</style>
</head>
<body>

<div class="header">
  <h1><span>AI 运行架构全景</span> — 从硬件到应用</h1>
  <p>CPU、GPU、CUDA、Ollama、vLLM...它们是什么关系？</p>
</div>

<div class="progress-bar" id="progressBar">
  <div class="progress-dot active" data-step="0" onclick="goToStep(0)"></div>
  <div class="progress-line" data-line="0"></div>
  <div class="progress-dot" data-step="1" onclick="goToStep(1)"></div>
  <div class="progress-line" data-line="1"></div>
  <div class="progress-dot" data-step="2" onclick="goToStep(2)"></div>
  <div class="progress-line" data-line="2"></div>
  <div class="progress-dot" data-step="3" onclick="goToStep(3)"></div>
  <div class="progress-line" data-line="3"></div>
  <div class="progress-dot" data-step="4" onclick="goToStep(4)"></div>
  <div class="progress-line" data-line="4"></div>
  <div class="progress-dot" data-step="5" onclick="goToStep(5)"></div>
  <div class="progress-line" data-line="5"></div>
  <div class="progress-dot" data-step="6" onclick="goToStep(6)"></div>
</div>
<div class="step-label" id="stepLabel">步骤 <strong>1</strong> / 7</div>

<div class="stage-container">
  <div class="stage" id="stage">
    <div class="step-title" id="stepTitle"></div>

    <!-- Ground shadow -->
    <div class="ground-shadow" id="groundShadow"></div>

    <!-- Character -->
    <div class="character-wrapper idle pos-far-left" id="character">
      <!-- Lightbulb above head -->
      <div class="lightbulb" id="lightbulb">
        <svg width="30" height="36" viewBox="0 0 30 36">
          <ellipse cx="15" cy="14" rx="11" ry="12" fill="#fbbf24" opacity="0.3"/>
          <path d="M15 2 C8 2 3 7.5 3 14 C3 19 6 22 9 24 L9 28 L21 28 L21 24 C24 22 27 19 27 14 C27 7.5 22 2 15 2Z" fill="#fbbf24"/>
          <rect x="10" y="28" width="10" height="3" rx="1" fill="#d4a017"/>
          <rect x="11" y="31" width="8" height="2" rx="1" fill="#d4a017"/>
          <path d="M15 8 L15 18 M10 13 L20 13" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        </svg>
      </div>

      <!-- Exclamation mark -->
      <div class="exclamation" id="exclamation">!</div>

      <!-- SVG Character -->
      <svg width="80" height="112" viewBox="0 0 100 140" id="charSvg">
        <!-- Body -->
        <rect class="char-body" x="30" y="62" width="40" height="45" rx="12" fill="#2563eb"/>

        <!-- Legs -->
        <rect x="35" y="102" width="12" height="22" rx="6" fill="#1d4ed8"/>
        <rect x="53" y="102" width="12" height="22" rx="6" fill="#1d4ed8"/>

        <!-- Shoes -->
        <ellipse cx="41" cy="126" rx="9" ry="5" fill="#1e293b"/>
        <ellipse cx="59" cy="126" rx="9" ry="5" fill="#1e293b"/>

        <!-- Arms -->
        <g class="char-arm-left">
          <rect x="17" y="66" width="14" height="30" rx="7" fill="#2563eb"/>
          <circle cx="24" cy="98" r="6" fill="#fde68a"/>
        </g>
        <g class="char-arm-right">
          <rect x="69" y="66" width="14" height="30" rx="7" fill="#2563eb"/>
          <circle cx="76" cy="98" r="6" fill="#fde68a"/>
        </g>

        <!-- Head -->
        <circle cx="50" cy="36" r="28" fill="#fde68a"/>

        <!-- Hat -->
        <path d="M25 32 Q25 14 50 10 Q75 14 75 32 Z" fill="#2563eb"/>
        <rect x="20" y="30" width="60" height="6" rx="3" fill="#1d4ed8"/>

        <!-- Face -->
        <g class="char-face">
          <!-- Eyes -->
          <circle class="char-eye" cx="40" cy="38" r="3.5" fill="#1e293b"/>
          <circle class="char-eye" cx="60" cy="38" r="3.5" fill="#1e293b"/>
          <!-- Eye shine -->
          <circle cx="41.5" cy="36.5" r="1.2" fill="white"/>
          <circle cx="61.5" cy="36.5" r="1.2" fill="white"/>
          <!-- Mouth -->
          <ellipse class="char-mouth" cx="50" cy="50" rx="6" ry="3" fill="#1e293b"/>
          <!-- Blush -->
          <ellipse cx="34" cy="48" rx="5" ry="3" fill="#fca5a5" opacity="0.4"/>
          <ellipse cx="66" cy="48" rx="5" ry="3" fill="#fca5a5" opacity="0.4"/>
        </g>
      </svg>
    </div>

    <!-- Confetti container -->
    <div class="confetti-container" id="confettiContainer"></div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-secondary" id="btnPrev" onclick="prevStep()" disabled>上一步</button>
  <button class="btn btn-step" id="btnStep" onclick="singleStep()">单步 ▶|</button>
  <button class="btn btn-primary" id="btnNext" onclick="nextStep()">下一步</button>
  <button class="btn btn-auto" id="btnAuto" onclick="toggleAutoPlay()">▶ 自动播放</button>
  <button class="btn btn-secondary" id="btnReplay" onclick="replay()">↺ 重播</button>
</div>

<script>
const STEPS = [
  { title: '第一步：硬件基础层', key: 'hardware' },
  { title: '第二步：GPU 计算驱动层', key: 'driver' },
  { title: '第三步：推理引擎层', key: 'engine' },
  { title: '第四步：运行时 / 服务层', key: 'runtime' },
  { title: '第五步：API 与应用层', key: 'api' },
  { title: '第六步：数据流动全链路', key: 'dataflow' },
  { title: '第七步：本地 vs 云端', key: 'compare' }
];

/* Layer color scheme */
const COLORS = {

function clearDynamic() {
  dynamicElements.forEach(el => {
    if (el && el.parentNode) el.parentNode.removeChild(el);
  });
  dynamicElements = [];

  character.className = 'character-wrapper idle pos-far-left';
  groundShadow.style.left = '10%';
  stepTitle.classList.remove('visible');
  lightbulb.classList.remove('on');
  exclamation.classList.remove('visible');
  confettiContainer.innerHTML = '';
}

function createElement(tag, attrs, parent) {
  const el = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(k => {
      if (k === 'style' && typeof attrs[k] === 'object') {
        Object.assign(el.style, attrs[k]);
      } else if (k === 'className') {
        el.className = attrs[k];
      } else if (k === 'innerHTML') {
        el.innerHTML = attrs[k];
      } else if (k === 'textContent') {
        el.textContent = attrs[k];
      } else {
        el.setAttribute(k, attrs[k]);
      }
    });
  }
  (parent || stage).appendChild(el);
  dynamicElements.push(el);
  return el;
}

function delay(ms) {
  return new Promise(function(resolve) {
    pendingResolve = resolve;
    if (playMode === 'auto') {
      delayTimer = setTimeout(function() { pendingResolve = null; resolve(); }, ms);
    }
  });
}

function resolveCurrentDelay() {
  if (delayTimer) { clearTimeout(delayTimer); delayTimer = null; }
  if (pendingResolve) { var r = pendingResolve; pendingResolve = null; r(); }
}

function abandonCurrentStep() {
  if (delayTimer) { clearTimeout(delayTimer); delayTimer = null; }
  pendingResolve = null;
  stepRunning = false;
}

function updateProgress(step) {
  document.querySelectorAll('.progress-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === step);
    dot.classList.toggle('completed', i < step);
  });
  document.querySelectorAll('.progress-line').forEach((line, i) => {
    line.classList.toggle('completed', i < step);
  });
  document.getElementById('stepLabel').innerHTML = `步骤 <strong>${step + 1}</strong> / 7`;
}

/* Helper: create an architecture layer */
function makeLayer(opts) {
  const { left, top, width, height, color, title, bodyHTML, id } = opts;
  const layer = createElement('div', {
    className: 'arch-layer',
    style: {
      left: left + 'px',
      top: top + 'px',
      width: width + 'px',
      height: height ? (height + 'px') : 'auto',
      border: '1.5px solid ' + (color.border || '#e2e8f0')
    },
    innerHTML: `
      <div class="arch-layer-header" style="background:${color.header}">
        ${title}
      </div>
      <div class="arch-layer-body" style="background:${color.bg}">
        ${bodyHTML}
      </div>
    `
  });
  if (id) layer.id = id;
  return layer;
}

/* Helper: create SVG arrow between two points */
function makeSvgArrow(x1, y1, x2, y2, color, dashed) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  const minX = Math.min(x1, x2) - 10;
  const minY = Math.min(y1, y2) - 10;
  const w = Math.abs(x2 - x1) + 20;
  const h = Math.abs(y2 - y1) + 20;
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.style.position = 'absolute';
  svg.style.left = minX + 'px';
  svg.style.top = minY + 'px';
  svg.style.zIndex = '12';
  svg.style.pointerEvents = 'none';
  svg.style.overflow = 'visible';

  const lx1 = x1 - minX;
  const ly1 = y1 - minY;
  const lx2 = x2 - minX;
  const ly2 = y2 - minY;

  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', lx1);
  line.setAttribute('y1', ly1);
  line.setAttribute('x2', lx2);
  line.setAttribute('y2', ly2);
  line.setAttribute('stroke', color || '#2563eb');
  line.setAttribute('stroke-width', '2');
  if (dashed) {
    line.setAttribute('stroke-dasharray', '5,3');
    line.style.animation = 'dash-move 0.6s linear infinite';
  }
  line.setAttribute('marker-end', 'url(#arrowhead-' + (color || '#2563eb').replace('#','') + ')');
  svg.appendChild(line);

  /* Arrowhead marker */
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
  marker.setAttribute('id', 'arrowhead-' + (color || '#2563eb').replace('#',''));
  marker.setAttribute('markerWidth', '8');
  marker.setAttribute('markerHeight', '6');
  marker.setAttribute('refX', '8');
  marker.setAttribute('refY', '3');
  marker.setAttribute('orient', 'auto');
  const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  polygon.setAttribute('points', '0 0, 8 3, 0 6');
  polygon.setAttribute('fill', color || '#2563eb');
  marker.appendChild(polygon);
  defs.appendChild(marker);
  svg.appendChild(defs);

  stage.appendChild(svg);
  dynamicElements.push(svg);
  return svg;
}

}

/* ===== Navigation ===== */
const stepFunctions = [stepHardware, stepDriver, stepEngine, stepRuntime, stepApi, stepDataflow, stepCompare];

async function goToStep(step) {
  if (step < 0 || step > MAX_STEP) return;
  abandonCurrentStep();
  currentStep = step;
  clearDynamic();
  updateProgress(step);
  updateControlUI();
  stepRunning = true;
  await stepFunctions[step]();
  stepRunning = false;
  if (playMode === 'auto' && currentStep === step && currentStep < MAX_STEP) {
    delayTimer = setTimeout(() => { delayTimer = null; if (playMode === 'auto') goToStep(step + 1); }, 1500);
  }
  if (playMode === 'auto' && currentStep >= MAX_STEP) { playMode = 'idle'; }
  updateControlUI();
}

function singleStep() {
  if (playMode === 'auto') { playMode = 'paused'; if (delayTimer) { clearTimeout(delayTimer); delayTimer = null; } }
  if (playMode !== 'paused') playMode = 'paused';
  if (pendingResolve) { resolveCurrentDelay(); }
  else if (currentStep < 0) { goToStep(0); }
  else if (!stepRunning && currentStep < MAX_STEP) { goToStep(currentStep + 1); }
  updateControlUI();
}

function nextStep() {
  if (currentStep >= MAX_STEP) return;
  if (playMode === 'auto') playMode = 'paused';
  goToStep(currentStep < 0 ? 0 : currentStep + 1);
}

function prevStep() {
  if (currentStep <= 0) return;
  if (playMode === 'auto') playMode = 'paused';
  goToStep(currentStep - 1);
}

function toggleAutoPlay() {
  if (playMode === 'auto') {
    playMode = 'paused';
    if (delayTimer) { clearTimeout(delayTimer); delayTimer = null; }
  } else {
    playMode = 'auto';
    if (pendingResolve) { resolveCurrentDelay(); }
    else if (currentStep < 0) { goToStep(0); }
    else if (currentStep >= MAX_STEP) { currentStep = -1; clearDynamic(); updateProgress(0); goToStep(0); }
    else if (!stepRunning) { goToStep(currentStep < MAX_STEP ? currentStep + 1 : 0); }
  }
  updateControlUI();
}

function replay() {
  abandonCurrentStep();
  playMode = 'idle';
  currentStep = -1;
  clearDynamic();
  updateProgress(0);
  updateControlUI();
  goToStep(0);
}

function updateControlUI() {
  var btnAuto = document.getElementById('btnAuto');
  var btnStep = document.getElementById('btnStep');
  var btnNext = document.getElementById('btnNext');
  var btnPrev = document.getElementById('btnPrev');
  if (btnAuto) {
    if (playMode === 'auto') { btnAuto.textContent = '⏸ 暂停'; btnAuto.classList.add('playing'); }
    else if (playMode === 'paused') { btnAuto.textContent = '▶ 继续'; btnAuto.classList.remove('playing'); }
    else { btnAuto.textContent = '▶ 自动播放'; btnAuto.classList.remove('playing'); }
  }
  if (btnStep) btnStep.disabled = (playMode === 'auto');
  if (btnNext) { btnNext.disabled = (playMode === 'auto' || currentStep >= MAX_STEP); btnNext.textContent = currentStep < MAX_STEP ? '下一步' : '完成'; }
  if (btnPrev) btnPrev.disabled = (playMode === 'auto' || currentStep <= 0);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') { e.preventDefault(); nextStep(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
  if (e.key === ' ') { e.preventDefault(); singleStep(); }
  if (e.key === 'r' || e.key === 'R') replay();
  if (e.key === 'p' || e.key === 'P') toggleAutoPlay();
});

playMode = 'paused';
goToStep(0);
</script>
