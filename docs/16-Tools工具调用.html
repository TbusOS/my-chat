<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools 工具调用 — AI 的施工队</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: #ffffff;
  color: #1e293b;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* Header */
.header {
  text-align: center;
  padding: 32px 20px 16px;
}

.header h1 {
  font-size: 32px;
  font-weight: 900;
  color: #1e293b;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.header h1 span {
  color: #2563eb;
}

.header p {
  font-size: 16px;
  color: #64748b;
  font-weight: 400;
}

/* Progress Bar */
.progress-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 16px 0 8px;
}

.progress-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #e2e8f0;
  transition: all 0.4s ease;
  cursor: pointer;
}

.progress-dot.active {
  background: #2563eb;
  transform: scale(1.3);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
}

.progress-dot.completed {
  background: #2563eb;
}

.progress-line {
  width: 24px;
  height: 2px;
  background: #e2e8f0;
  transition: background 0.4s ease;
}

.progress-line.completed {
  background: #2563eb;
}

.step-label {
  font-size: 14px;
  color: #94a3b8;
  font-weight: 500;
  margin-top: 6px;
}

.step-label strong {
  color: #2563eb;
}

/* Stage */
.stage-container {
  position: relative;
  width: 680px;
  height: 440px;
  margin: 12px 0 16px;
  background: #f8fafc;
  border-radius: 20px;
  border: 2px solid #e2e8f0;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.04);
}

.stage {
  position: relative;
  width: 100%;
  height: 100%;
}

/* Step title inside stage */
.step-title {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 15px;
  font-weight: 700;
  color: #2563eb;
  background: #eff6ff;
  padding: 4px 18px;
  border-radius: 20px;
  z-index: 20;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.step-title.visible {
  opacity: 1;
}

/* Character */
.character-wrapper {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  transition: left 0.8s ease, transform 0.8s ease;
}

.character-wrapper.idle {
  animation: bobbing 2s ease-in-out infinite;
}

.character-wrapper.nod {
  animation: nod 0.5s ease-in-out 2;
}

.character-wrapper.thinking {
  animation: thinking-bob 2.5s ease-in-out infinite;
}

.character-wrapper.eureka {
  animation: eureka 0.6s ease-out;
}

.character-wrapper.celebrate {
  animation: celebrate 0.5s ease-in-out 3;
}

.character-wrapper.pos-right {
  left: 62%;
}

.character-wrapper.pos-center {
  left: 50%;
}

.character-wrapper.pos-left {
  left: 28%;
}

.character-wrapper.pos-left-center {
  left: 38%;
}

@keyframes bobbing {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-6px); }
}

@keyframes nod {
  0%, 100% { transform: translateX(-50%) rotate(0deg); }
  30% { transform: translateX(-50%) rotate(8deg); }
  60% { transform: translateX(-50%) rotate(-4deg); }
}

@keyframes thinking-bob {
  0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  30% { transform: translateX(-50%) translateY(-4px) rotate(-2deg); }
  70% { transform: translateX(-50%) translateY(-2px) rotate(2deg); }
}

@keyframes eureka {
  0% { transform: translateX(-50%) translateY(0) scale(1); }
  40% { transform: translateX(-50%) translateY(-20px) scale(1.1); }
  100% { transform: translateX(-50%) translateY(0) scale(1); }
}

@keyframes celebrate {
  0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  25% { transform: translateX(-50%) translateY(-15px) rotate(-8deg); }
  75% { transform: translateX(-50%) translateY(-15px) rotate(8deg); }
}

/* Character SVG parts */
.char-arm-left, .char-arm-right {
  transition: transform 0.4s ease;
  transform-origin: center top;
}

.character-wrapper.wave .char-arm-right {
  animation: wave-arm 0.6s ease-in-out 2;
}

.character-wrapper.reach .char-arm-right {
  transform: rotate(-60deg) translateX(5px);
}

.character-wrapper.point .char-arm-right {
  transform: rotate(-45deg) translateX(10px) translateY(-10px);
}

.character-wrapper.chin .char-arm-right {
  transform: rotate(-70deg) translateX(2px) translateY(-15px);
}

.character-wrapper.present .char-arm-left,
.character-wrapper.present .char-arm-right {
  transform: rotate(-40deg);
}

.character-wrapper.shrug .char-arm-left {
  transform: rotate(-30deg);
}
.character-wrapper.shrug .char-arm-right {
  transform: rotate(30deg);
}

@keyframes wave-arm {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-40deg); }
}

/* Character eyes */
.char-eye {
  transition: all 0.3s ease;
}

.character-wrapper.look-left .char-eye {
  transform: translateX(-2px);
}

.character-wrapper.look-right .char-eye {
  transform: translateX(2px);
}

/* Character eyes glow */
.character-wrapper.eyes-glow .char-eye {
  fill: #2563eb;
  filter: drop-shadow(0 0 4px rgba(37, 99, 235, 0.6));
}

/* Character mouth */
.char-mouth {
  transition: all 0.3s ease;
}

.character-wrapper.surprise .char-mouth {
  rx: 4;
  ry: 4;
}

/* Lightbulb */
.lightbulb {
  position: absolute;
  top: -45px;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0;
  transition: opacity 0.5s ease;
}

.lightbulb.on {
  opacity: 1;
  animation: glow-pulse 1.5s ease-in-out infinite;
}

@keyframes glow-pulse {
  0%, 100% { filter: drop-shadow(0 0 4px rgba(250, 204, 21, 0.4)); }
  50% { filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.8)); }
}

/* Exclamation */
.exclamation {
  position: absolute;
  top: -40px;
  right: -30px;
  font-size: 32px;
  font-weight: 900;
  color: #ef4444;
  opacity: 0;
  transform: scale(0);
  transition: all 0.3s ease;
}

.exclamation.visible {
  opacity: 1;
  transform: scale(1);
  animation: exclaim-pop 0.5s ease-out;
}

@keyframes exclaim-pop {
  0% { transform: scale(0) rotate(-20deg); }
  60% { transform: scale(1.3) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* Speech Bubbles */
.bubble {
  position: absolute;
  background: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: 16px;
  padding: 12px 18px;
  font-size: 14px;
  line-height: 1.6;
  color: #334155;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  opacity: 0;
  transform: scale(0.8) translateY(10px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
  max-width: 240px;
}

.bubble.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.bubble::after {
  content: '';
  position: absolute;
  width: 0;
  height: 0;
}

.bubble.tail-right::after {
  bottom: 20px;
  right: -10px;
  border-left: 10px solid #ffffff;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.bubble.tail-left::after {
  bottom: 20px;
  left: -10px;
  border-right: 10px solid #ffffff;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.bubble.tail-bottom::after {
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border-top: 10px solid #ffffff;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
}

/* Thought bubble */
.thought-bubble {
  position: absolute;
  background: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: 20px;
  padding: 16px 20px;
  font-size: 13px;
  line-height: 1.8;
  color: #334155;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
}

.thought-bubble.visible {
  opacity: 1;
  transform: scale(1);
}

.thought-bubble .thought-dots {
  position: absolute;
  bottom: -20px;
  left: 30px;
}

.thought-bubble .thought-dots span {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #e2e8f0;
  border-radius: 50%;
  margin: 0 2px;
}

.thought-bubble .thought-dots span:first-child {
  width: 12px;
  height: 12px;
}

.thought-bubble .thought-dots span:last-child {
  width: 5px;
  height: 5px;
}

/* Task list items */
.task-item {
  opacity: 0;
  transform: translateX(-10px);
  transition: all 0.4s ease;
  white-space: nowrap;
  padding: 4px 0;
}

.task-item.visible {
  opacity: 1;
  transform: translateX(0);
}

.task-item.greyed {
  color: #94a3b8;
}

.task-item.active {
  color: #1e293b;
  font-weight: 600;
}

/* Toolbox */
.toolbox {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) translateY(100%);
  transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 8;
}

.toolbox.open {
  transform: translateX(-50%) translateY(0);
}

.toolbox-body {
  background: #1e293b;
  border-radius: 12px 12px 0 0;
  padding: 16px 20px 12px;
  display: flex;
  gap: 16px;
}

.tool-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.4s ease;
}

.tool-item.visible {
  opacity: 1;
  transform: translateY(0);
}

.tool-item.grabbed {
  transform: translateY(-10px) scale(1.15);
  filter: drop-shadow(0 4px 8px rgba(37, 99, 235, 0.3));
}

.tool-item.glow {
  filter: drop-shadow(0 0 12px rgba(37, 99, 235, 0.5));
}

.tool-icon {
  width: 44px;
  height: 44px;
  background: #334155;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  transition: all 0.3s ease;
}

.tool-item.visible .tool-icon {
  animation: tool-wiggle 0.5s ease-in-out;
  animation-delay: var(--delay, 0s);
}

.tool-item.grabbed .tool-icon {
  background: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
}

.tool-item.processing .tool-icon {
  background: #2563eb;
  animation: tool-processing 0.8s ease-in-out infinite;
}

@keyframes tool-wiggle {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-8deg); }
  75% { transform: rotate(8deg); }
}

@keyframes tool-processing {
  0%, 100% { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3); }
  50% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0.15), 0 0 20px rgba(37, 99, 235, 0.3); }
}

.tool-label {
  font-size: 11px;
  color: #94a3b8;
  font-weight: 500;
}

/* Code panel */
.code-panel {
  position: absolute;
  background: #1e293b;
  border-radius: 12px;
  padding: 0;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  line-height: 1.7;
  color: #e2e8f0;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  opacity: 0;
  transform: scale(0.9) translateY(10px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 14;
  overflow: hidden;
}

.code-panel.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.code-panel-header {
  background: #334155;
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.code-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.code-dot.red { background: #ef4444; }
.code-dot.yellow { background: #eab308; }
.code-dot.green { background: #22c55e; }

.code-panel-title {
  font-size: 11px;
  color: #94a3b8;
  margin-left: 6px;
  font-family: 'Noto Sans SC', sans-serif;
}

.code-panel-body {
  padding: 12px 16px;
}

.code-line {
  opacity: 0;
  transform: translateX(-5px);
  transition: all 0.3s ease;
  white-space: nowrap;
}

.code-line.visible {
  opacity: 1;
  transform: translateX(0);
}

.code-comment { color: #64748b; }
.code-keyword { color: #818cf8; }
.code-func { color: #38bdf8; }
.code-string { color: #34d399; }
.code-warning { color: #fbbf24; }

/* Request card */
.request-card {
  position: absolute;
  background: #ffffff;
  border: 2px solid #2563eb;
  border-radius: 12px;
  padding: 0;
  font-size: 13px;
  line-height: 1.8;
  box-shadow: 0 4px 16px rgba(37, 99, 235, 0.15);
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 16;
  overflow: hidden;
}

.request-card.visible {
  opacity: 1;
  transform: scale(1);
}

.request-card.fly-to-tool {
  transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  transform: scale(0.5) translateY(80px);
  opacity: 0;
}

.request-card-header {
  background: #2563eb;
  color: white;
  padding: 6px 14px;
  font-weight: 700;
  font-size: 12px;
}

.request-card-body {
  padding: 10px 14px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: #334155;
}

.request-card-body .req-key {
  color: #2563eb;
  font-weight: 700;
}

.request-card-body .req-val {
  color: #1e293b;
}

/* Chain step */
.chain-step {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transform: translateX(-10px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  font-size: 13px;
  font-weight: 500;
  color: #334155;
  z-index: 14;
}

.chain-step.visible {
  opacity: 1;
  transform: translateX(0);
}

.chain-step.active {
  color: #2563eb;
  font-weight: 700;
}

.chain-step .chain-icon {
  width: 36px;
  height: 36px;
  background: #e2e8f0;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: all 0.3s ease;
}

.chain-step.active .chain-icon {
  background: #2563eb;
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
}

.chain-step .chain-num {
  width: 22px;
  height: 22px;
  background: #e2e8f0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #64748b;
  flex-shrink: 0;
}

.chain-step.active .chain-num {
  background: #2563eb;
  color: white;
}

.chain-arrow {
  position: absolute;
  color: #94a3b8;
  font-size: 16px;
  opacity: 0;
  transition: all 0.3s ease;
}

.chain-arrow.visible {
  opacity: 1;
}

.chain-arrow.active {
  color: #2563eb;
}

/* Summary panel */
.summary-panel {
  position: absolute;
  background: #ffffff;
  border: 2px solid #2563eb;
  border-radius: 16px;
  padding: 0;
  font-size: 13px;
  line-height: 1.8;
  box-shadow: 0 8px 32px rgba(37, 99, 235, 0.12);
  opacity: 0;
  transform: scale(0.5) rotate(-5deg);
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
  overflow: hidden;
}

.summary-panel.visible {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.summary-header {
  background: #2563eb;
  color: white;
  padding: 8px 18px;
  font-weight: 700;
  font-size: 14px;
}

.summary-body {
  padding: 14px 18px;
}

.summary-item {
  opacity: 0;
  transform: translateX(-8px);
  transition: all 0.4s ease;
  padding: 3px 0;
}

.summary-item.visible {
  opacity: 1;
  transform: translateX(0);
}

/* User message bubble */
.user-msg {
  position: absolute;
  background: #eff6ff;
  border: 2px solid #bfdbfe;
  border-radius: 16px;
  padding: 10px 16px;
  font-size: 13px;
  color: #1e40af;
  font-weight: 500;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  opacity: 0;
  transform: scale(0.8) translateY(10px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
}

.user-msg.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

/* Flying request animation */
@keyframes fly-to-right {
  0% { transform: translate(0, 0) scale(1); opacity: 1; }
  100% { transform: translate(160px, 120px) scale(0.4); opacity: 0; }
}

/* Result fly animation */
@keyframes fly-from-right {
  0% { transform: translate(160px, 120px) scale(0.4); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translate(0, 0) scale(1); opacity: 1; }
}

/* Confetti */
.confetti-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 30;
  overflow: hidden;
}

.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  opacity: 0;
}

.confetti.active {
  animation: confetti-fall 2s ease-out forwards;
}

@keyframes confetti-fall {
  0% { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translateY(400px) rotate(720deg) scale(0.5); }
}

/* Ground shadow */
.ground-shadow {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 8px;
  background: radial-gradient(ellipse, rgba(0,0,0,0.08) 0%, transparent 70%);
  z-index: 5;
  transition: left 0.8s ease;
}

/* Held tool */
.held-tool {
  position: absolute;
  top: 10px;
  right: -20px;
  font-size: 20px;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 11;
}

.held-tool.visible {
  opacity: 1;
  animation: tool-held-bounce 0.5s ease-out;
}

@keyframes tool-held-bounce {
  0% { transform: scale(0); }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* Controls */
.controls {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 8px 0 32px;
}

.btn {
  padding: 10px 24px;
  border: none;
  border-radius: 10px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(0);
}

.btn-primary {
  background: #2563eb;
  color: white;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
}

.btn-primary:hover {
  background: #1d4ed8;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
}

.btn-primary:disabled {
  background: #94a3b8;
  box-shadow: none;
  cursor: not-allowed;
  transform: none;
}

.btn-secondary {
  background: #f1f5f9;
  color: #475569;
  border: 1px solid #e2e8f0;
}

.btn-secondary:hover {
  background: #e2e8f0;
}

.btn-auto {
  background: #f0fdf4;
  color: #16a34a;
  border: 1px solid #bbf7d0;
}

.btn-auto:hover {
  background: #dcfce7;
}

.btn-auto.playing {
  background: #fef2f2;
  color: #dc2626;
  border-color: #fecaca;
}

/* Responsive */
@media (max-width: 720px) {
  .stage-container {
    width: 95vw;
    height: 380px;
  }
  .header h1 { font-size: 24px; }
  .bubble, .thought-bubble { font-size: 12px; max-width: 180px; }
  .code-panel { font-size: 10px; }
}
</style>
</head>
<body>

<div class="header">
  <h1><span>Tools 工具调用</span> — AI 的施工队</h1>
  <p>AI 不能直接干活，但它能指挥工具帮你干</p>
</div>

<div class="progress-bar" id="progressBar">

  { title: '第六步：工具调用的本质', key: 'summary' }

let currentStep = -1;

const stage = document.getElementById('stage');
const character = document.getElementById('character');

const exclamation = document.getElementById('exclamation');
const heldTool = document.getElementById('heldTool');
const groundShadow = document.getElementById('groundShadow');
const confettiContainer = document.getElementById('confettiContainer');

function clearDynamic() {
  dynamicElements.forEach(el => {
    if (el && el.parentNode) el.parentNode.removeChild(el);
  });
  dynamicElements = [];

  character.className = 'character-wrapper idle pos-center';
  groundShadow.style.left = '50%';
  stepTitle.classList.remove('visible');
  lightbulb.classList.remove('on');
  exclamation.classList.remove('visible');
  heldTool.classList.remove('visible');
  heldTool.textContent = '';
  confettiContainer.innerHTML = '';
}

function createElement(tag, attrs, parent) {
  const el = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(k => {
      if (k === 'style' && typeof attrs[k] === 'object') {
        Object.assign(el.style, attrs[k]);
      } else if (k === 'className') {
        el.className = attrs[k];
      } else if (k === 'innerHTML') {
        el.innerHTML = attrs[k];
      } else if (k === 'textContent') {
        el.textContent = attrs[k];
      } else {
        el.setAttribute(k, attrs[k]);
      }
    });
  }
  (parent || stage).appendChild(el);
  dynamicElements.push(el);
  return el;
}

function delay(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function updateProgress(step) {
  document.querySelectorAll('.progress-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === step);
    dot.classList.toggle('completed', i < step);
  });
  document.querySelectorAll('.progress-line').forEach((line, i) => {
    line.classList.toggle('completed', i < step);
  });
  document.getElementById('stepLabel').innerHTML = `步骤 <strong>${step + 1}</strong> / 6`;
}

/* ===== STEP 4: 链式调用 ===== */
async function stepChain() {
  character.className = 'character-wrapper idle pos-left';
  groundShadow.style.left = '28%';

  stepTitle.textContent = STEPS[4].title;
  await delay(200);
  stepTitle.classList.add('visible');

  // Chain pipeline steps
  const chainData = [
    { icon: '📁', label: 'Read → 读取 db.ts', top: 55 },
    { icon: '🧠', label: 'AI 分析代码', top: 110 },
    { icon: '✏️', label: 'Edit → 修改代码优化查询', top: 165 },
    { icon: '💻', label: 'Bash → 运行测试验证', top: 220 },
    { icon: '✅', label: '全部通过！', top: 275 }
  ];

  const chainSteps = [];
  const arrows = [];

  for (let i = 0; i < chainData.length; i++) {
    const step = createElement('div', {
      className: 'chain-step',
      style: { right: '50px', top: chainData[i].top + 'px', width: '280px' },
      innerHTML: `
        <div class="chain-num">${i + 1}</div>
        <div class="chain-icon">${chainData[i].icon}</div>
        <span>${chainData[i].label}</span>
      `
    });
    chainSteps.push(step);

    // Arrow between steps (except after last)
    if (i < chainData.length - 1) {
      const arrow = createElement('div', {
        className: 'chain-arrow',
        style: { right: '300px', top: (chainData[i].top + 38) + 'px' },
        innerHTML: '↓'
      });
      arrows.push(arrow);
    }
  }

  // Animate each step sequentially
  for (let i = 0; i < chainSteps.length; i++) {
    await delay(500);
    chainSteps[i].classList.add('visible');
    chainSteps[i].classList.add('active');

    // Show arrow before this step (if not first)
    if (i > 0 && arrows[i - 1]) {
      arrows[i - 1].classList.add('visible');
      arrows[i - 1].classList.add('active');
    }

    // Deactivate previous step
    if (i > 0) {
      chainSteps[i - 1].classList.remove('active');
    }

    await delay(300);
  }

  // Speech bubble
  const speechBubble = createElement('div', {
    className: 'bubble tail-right',
    style: { left: '10px', bottom: '190px', maxWidth: '210px' },
    innerHTML: '<span style="font-weight:700;color:#2563eb">一个工具不够？</span><br>那就多叫几个！'
  });

  await delay(400);
  speechBubble.classList.add('visible');

  await delay(300);
  character.className = 'character-wrapper present pos-left';

  await delay(800);
  character.className = 'character-wrapper idle pos-left';
}

  summary.classList.add('visible');

  // Animate summary items
  const items = summary.querySelectorAll('.summary-item');
  for (let i = 0; i < items.length; i++) {
    await delay(500);
    items[i].classList.add('visible');
  }

  // Celebration
  await delay(500);
  character.className = 'character-wrapper celebrate pos-left';

  // Confetti
  spawnConfetti();

  await delay(1500);
  character.className = 'character-wrapper idle pos-left';
}

function spawnConfetti() {
  const colors = ['#2563eb', '#22c55e', '#eab308', '#ef4444', '#a855f7', '#f97316'];
  for (let i = 0; i < 40; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = (Math.random() * 100) + '%';
    confetti.style.top = '-10px';
    confetti.style.width = (4 + Math.random() * 6) + 'px';
    confetti.style.height = (4 + Math.random() * 6) + 'px';
    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    confetti.style.animationDelay = (Math.random() * 0.8) + 's';
    confetti.style.animationDuration = (1.5 + Math.random() * 1) + 's';
    confettiContainer.appendChild(confetti);
    setTimeout(() => confetti.classList.add('active'), 10);
  }
}

/* ===== Navigation ===== */
const stepFunctions = [stepLimitation, stepToolbox, stepRequest, stepExecute, stepChain, stepSummary];

async function goToStep(step) {
  if (step < 0 || step > 5) return;
  if (step === currentStep) return;

  currentStep = step;
  clearDynamic();
  updateProgress(step);

  const btnNext = document.getElementById('btnNext');
  btnNext.disabled = false;
  btnNext.textContent = step < 5 ? '下一步' : '完成';
  if (step >= 5) {
    btnNext.disabled = true;
  }

  await stepFunctions[step]();
}

async function nextStep() {
  if (currentStep >= 5) return;
  await goToStep(currentStep + 1);
}

function prevStep(){if(!isAutoPlaying&&currentStep>0)goToStep(currentStep-1)}
function replay() {
  stopAutoPlay();
  currentStep = -1;
  clearDynamic();
  updateProgress(0);
  document.getElementById('btnNext').disabled = false;
  document.getElementById('btnNext').textContent = '下一步';
  goToStep(0);
}

let isAutoPlaying = false;

function toggleAutoPlay() {
  if (isAutoPlaying) {
    stopAutoPlay();
  } else {
    startAutoPlay();
  }
}

function startAutoPlay() {
  isAutoPlaying = true;
  const btn = document.getElementById('btnAuto');
  btn.textContent = '暂停播放';
  btn.classList.add('playing');
  document.getElementById('btnNext').disabled = true;
  currentStep = -1; clearDynamic(); updateProgress(0);

  const advanceStep = async () => {
    if (!isAutoPlaying) return;
    if (currentStep >= 5) {
      stopAutoPlay();
      return;
    }
    await goToStep(currentStep < 0 ? 0 : currentStep + 1);
    if (isAutoPlaying) {
      autoPlayInterval = setTimeout(advanceStep, 4000);
    }
  };

  advanceStep();
}

function stopAutoPlay() {
  isAutoPlaying = false;
  if (autoPlayInterval) {
    clearTimeout(autoPlayInterval);
    autoPlayInterval = null;
  }
  const btn = document.getElementById('btnAuto');
  btn.textContent = '自动播放';
  btn.classList.remove('playing');
  document.getElementById('btnNext').disabled = (currentStep >= 5);
}

// Keyboard support
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    if (!isAutoPlaying) nextStep();
  }
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (!isAutoPlaying && currentStep > 0) goToStep(currentStep - 1);
  }
  if (e.key === 'r' || e.key === 'R') {
    replay();
  }
});

// Start at step 0
goToStep(0);
</script>
