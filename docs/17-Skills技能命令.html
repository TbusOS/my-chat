<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills 技能命令 — 一键施放的技能书</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: #ffffff;
  color: #1e293b;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* Header */
.header {
  text-align: center;
  padding: 32px 20px 16px;
}

.header h1 {
  font-size: 32px;
  font-weight: 900;
  color: #1e293b;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.header h1 span {
  color: #2563eb;
}

.header p {
  font-size: 16px;
  color: #64748b;
  font-weight: 400;
}

/* Progress Bar */
.progress-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 16px 0 8px;
}

.progress-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #e2e8f0;
  transition: all 0.4s ease;
  cursor: pointer;
}

.progress-dot.active {
  background: #2563eb;
  transform: scale(1.3);
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
}

.progress-dot.completed {
  background: #2563eb;
}

.progress-line {
  width: 24px;
  height: 2px;
  background: #e2e8f0;
  transition: background 0.4s ease;
}

.progress-line.completed {
  background: #2563eb;
}

.step-label {
  font-size: 14px;
  color: #94a3b8;
  font-weight: 500;
  margin-top: 6px;
}

.step-label strong {
  color: #2563eb;
}

/* Stage */
.stage-container {
  position: relative;
  width: 680px;
  height: 440px;
  margin: 12px 0 16px;
  background: #f8fafc;
  border-radius: 20px;
  border: 2px solid #e2e8f0;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.04);
}

.stage {
  position: relative;
  width: 100%;
  height: 100%;
}

/* Step title inside stage */
.step-title {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 15px;
  font-weight: 700;
  color: #2563eb;
  background: #eff6ff;
  padding: 4px 18px;
  border-radius: 20px;
  z-index: 20;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.step-title.visible {
  opacity: 1;
}

/* Character */
.character-wrapper {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  transition: left 0.8s ease, transform 0.8s ease;
}

.character-wrapper.idle {
  animation: bobbing 2s ease-in-out infinite;
}

.character-wrapper.nod {
  animation: nod 0.5s ease-in-out 2;
}

.character-wrapper.thinking {
  animation: thinking-bob 2.5s ease-in-out infinite;
}

.character-wrapper.eureka {
  animation: eureka 0.6s ease-out;
}

.character-wrapper.celebrate {
  animation: celebrate 0.5s ease-in-out 3;
}

.character-wrapper.pos-right {
  left: 62%;
}

.character-wrapper.pos-center {
  left: 50%;
}

.character-wrapper.pos-left {
  left: 38%;
}

.character-wrapper.pos-far-left {
  left: 22%;
}

@keyframes bobbing {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-6px); }
}

@keyframes nod {
  0%, 100% { transform: translateX(-50%) rotate(0deg); }
  30% { transform: translateX(-50%) rotate(8deg); }
  60% { transform: translateX(-50%) rotate(-4deg); }
}

@keyframes thinking-bob {
  0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  30% { transform: translateX(-50%) translateY(-4px) rotate(-2deg); }
  70% { transform: translateX(-50%) translateY(-2px) rotate(2deg); }
}

@keyframes eureka {
  0% { transform: translateX(-50%) translateY(0) scale(1); }
  40% { transform: translateX(-50%) translateY(-20px) scale(1.1); }
  100% { transform: translateX(-50%) translateY(0) scale(1); }
}

@keyframes celebrate {
  0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
  25% { transform: translateX(-50%) translateY(-15px) rotate(-8deg); }
  75% { transform: translateX(-50%) translateY(-15px) rotate(8deg); }
}

/* Character SVG parts */
.char-arm-left, .char-arm-right {
  transition: transform 0.4s ease;
  transform-origin: center top;
}

.character-wrapper.wave .char-arm-right {
  animation: wave-arm 0.6s ease-in-out 2;
}

.character-wrapper.reach .char-arm-right {
  transform: rotate(-60deg) translateX(5px);
}

.character-wrapper.point .char-arm-right {
  transform: rotate(-45deg) translateX(10px) translateY(-10px);
}

.character-wrapper.chin .char-arm-right {
  transform: rotate(-70deg) translateX(2px) translateY(-15px);
}

.character-wrapper.present .char-arm-left,
.character-wrapper.present .char-arm-right {
  transform: rotate(-40deg);
}

@keyframes wave-arm {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-40deg); }
}

/* Character eyes */
.char-eye {
  transition: all 0.3s ease;
}

.character-wrapper.look-left .char-eye {
  transform: translateX(-2px);
}

.character-wrapper.look-right .char-eye {
  transform: translateX(2px);
}

/* Character mouth */
.char-mouth {
  transition: all 0.3s ease;
}

.character-wrapper.surprise .char-mouth {
  rx: 4;
  ry: 4;
}

/* Sweat drop */
.sweat-drop {
  position: absolute;
  top: 15px;
  right: 5px;
  font-size: 16px;
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 11;
}

.sweat-drop.visible {
  opacity: 1;
  animation: sweat-drip 1.5s ease-in-out infinite;
}

@keyframes sweat-drip {
  0%, 100% { transform: translateY(0); opacity: 1; }
  50% { transform: translateY(8px); opacity: 0.5; }
}

/* Lightbulb */
.lightbulb {
  position: absolute;
  top: -45px;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0;
  transition: opacity 0.5s ease;
}

.lightbulb.on {
  opacity: 1;
  animation: glow-pulse 1.5s ease-in-out infinite;
}

@keyframes glow-pulse {
  0%, 100% { filter: drop-shadow(0 0 4px rgba(250, 204, 21, 0.4)); }
  50% { filter: drop-shadow(0 0 12px rgba(250, 204, 21, 0.8)); }
}

/* Exclamation */
.exclamation {
  position: absolute;
  top: -40px;
  right: -30px;
  font-size: 32px;
  font-weight: 900;
  color: #ef4444;
  opacity: 0;
  transform: scale(0);
  transition: all 0.3s ease;
}

.exclamation.visible {
  opacity: 1;
  transform: scale(1);
  animation: exclaim-pop 0.5s ease-out;
}

@keyframes exclaim-pop {
  0% { transform: scale(0) rotate(-20deg); }
  60% { transform: scale(1.3) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* Speech Bubbles */
.bubble {
  position: absolute;
  background: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: 16px;
  padding: 12px 18px;
  font-size: 14px;
  line-height: 1.6;
  color: #334155;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  opacity: 0;
  transform: scale(0.8) translateY(10px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
  max-width: 240px;
}

.bubble.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.bubble::after {
  content: '';
  position: absolute;
  width: 0;
  height: 0;
}

.bubble.tail-right::after {
  bottom: 20px;
  right: -10px;
  border-left: 10px solid #ffffff;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.bubble.tail-left::after {
  bottom: 20px;
  left: -10px;
  border-right: 10px solid #ffffff;
  border-top: 6px solid transparent;
  border-bottom: 6px solid transparent;
}

.bubble.tail-bottom::after {
  bottom: -10px;
  left: 50%;
  transform: translateX(-50%);
  border-top: 10px solid #ffffff;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
}

/* Thought bubble */
.thought-bubble {
  position: absolute;
  background: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: 20px;
  padding: 16px 20px;
  font-size: 13px;
  line-height: 1.8;
  color: #334155;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
}

.thought-bubble.visible {
  opacity: 1;
  transform: scale(1);
}

.thought-bubble .thought-dots {
  position: absolute;
  bottom: -20px;
  left: 30px;
}

.thought-bubble .thought-dots span {
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #e2e8f0;
  border-radius: 50%;
  margin: 0 2px;
}

.thought-bubble .thought-dots span:first-child {
  width: 12px;
  height: 12px;
}

.thought-bubble .thought-dots span:last-child {
  width: 5px;
  height: 5px;
}

/* Skill book */
.skill-book {
  position: absolute;
  background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
  border-radius: 12px;
  border: 3px solid #2563eb;
  box-shadow: 0 8px 32px rgba(37, 99, 235, 0.25), 0 0 0 1px rgba(37, 99, 235, 0.1);
  opacity: 0;
  transform: scale(0);
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 14;
  overflow: hidden;
}

.skill-book.visible {
  opacity: 1;
  transform: scale(1);
}

.skill-book.glow {
  box-shadow: 0 0 30px rgba(37, 99, 235, 0.4), 0 0 60px rgba(37, 99, 235, 0.15), 0 8px 32px rgba(37, 99, 235, 0.25);
  animation: book-glow 2s ease-in-out infinite;
}

@keyframes book-glow {
  0%, 100% { box-shadow: 0 0 30px rgba(37, 99, 235, 0.4), 0 0 60px rgba(37, 99, 235, 0.15); }
  50% { box-shadow: 0 0 50px rgba(37, 99, 235, 0.6), 0 0 80px rgba(37, 99, 235, 0.25); }
}

.skill-book-header {
  background: #2563eb;
  padding: 8px 16px;
  font-weight: 700;
  font-size: 14px;
  color: white;
  text-align: center;
}

.skill-book-body {
  padding: 10px 14px;
}

/* Skill cards */
.skill-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  margin: 4px 0;
  background: rgba(255, 255, 255, 0.06);
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.08);
  opacity: 0;
  transform: translateX(-10px);
  transition: all 0.4s ease;
}

.skill-card.visible {
  opacity: 1;
  transform: translateX(0);
}

.skill-card-cmd {
  font-family: 'Courier New', monospace;
  font-size: 13px;
  font-weight: 700;
  color: #60a5fa;
  white-space: nowrap;
}

.skill-card-desc {
  font-size: 12px;
  color: #94a3b8;
  white-space: nowrap;
}

.skill-card-divider {
  color: #475569;
  font-size: 12px;
}

/* Slash command display */
.slash-cmd {
  position: absolute;
  font-family: 'Courier New', monospace;
  font-size: 22px;
  font-weight: 900;
  color: #60a5fa;
  text-shadow: 0 0 20px rgba(96, 165, 250, 0.6), 0 0 40px rgba(96, 165, 250, 0.3);
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 16;
  white-space: nowrap;
}

.slash-cmd.visible {
  opacity: 1;
  transform: scale(1);
  animation: cmd-glow 1.5s ease-in-out infinite;
}

@keyframes cmd-glow {
  0%, 100% { text-shadow: 0 0 20px rgba(96, 165, 250, 0.6), 0 0 40px rgba(96, 165, 250, 0.3); }
  50% { text-shadow: 0 0 30px rgba(96, 165, 250, 0.8), 0 0 60px rgba(96, 165, 250, 0.5); }
}

/* Code panel */
.code-panel {
  position: absolute;
  background: #1e293b;
  border-radius: 12px;
  padding: 0;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  line-height: 1.7;
  color: #e2e8f0;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  opacity: 0;
  transform: scale(0.9) translateY(10px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 14;
  overflow: hidden;
}

.code-panel.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.code-panel-header {
  background: #334155;
  padding: 6px 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.code-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.code-dot.red { background: #ef4444; }
.code-dot.yellow { background: #eab308; }
.code-dot.green { background: #22c55e; }

.code-panel-title {
  font-size: 11px;
  color: #94a3b8;
  margin-left: 6px;
  font-family: 'Noto Sans SC', sans-serif;
}

.code-panel-body {
  padding: 12px 16px;
}

.code-line {
  opacity: 0;
  transform: translateX(-5px);
  transition: all 0.3s ease;
  white-space: nowrap;
}

.code-line.visible {
  opacity: 1;
  transform: translateX(0);
}

.code-comment { color: #64748b; }
.code-keyword { color: #818cf8; }
.code-func { color: #38bdf8; }
.code-string { color: #34d399; }
.code-warning { color: #fbbf24; }

/* Action sequence item */
.action-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  opacity: 0;
  transform: translateX(-10px);
  transition: all 0.4s ease;
  font-size: 13px;
  font-family: 'Noto Sans SC', sans-serif;
  color: #e2e8f0;
}

.action-item.visible {
  opacity: 1;
  transform: translateX(0);
}

.action-item.done {
  color: #22c55e;
}

.action-icon {
  font-size: 16px;
  min-width: 20px;
  text-align: center;
}

/* Time indicator */
.time-indicator {
  position: absolute;
  background: linear-gradient(135deg, #dcfce7, #f0fdf4);
  border: 2px solid #22c55e;
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 13px;
  font-weight: 600;
  color: #16a34a;
  opacity: 0;
  transform: scale(0.8);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
  white-space: nowrap;
}

.time-indicator.visible {
  opacity: 1;
  transform: scale(1);
}

/* Review panel */
.review-panel {
  position: absolute;
  background: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: 16px;
  padding: 0;
  font-size: 13px;
  line-height: 1.8;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  opacity: 0;
  transform: scale(0.8) translateY(10px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
  overflow: hidden;
}

.review-panel.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.review-header {
  background: #f59e0b;
  color: white;
  padding: 8px 18px;
  font-weight: 700;
  font-size: 14px;
}

.review-body {
  padding: 12px 16px;
}

.review-item {
  opacity: 0;
  transform: translateX(-8px);
  transition: all 0.4s ease;
  padding: 3px 0;
}

.review-item.visible {
  opacity: 1;
  transform: translateX(0);
}

/* Plan panel */
.plan-panel {
  position: absolute;
  background: #ffffff;
  border: 2px solid #2563eb;
  border-radius: 16px;
  padding: 0;
  font-size: 13px;
  line-height: 1.8;
  box-shadow: 0 8px 32px rgba(37, 99, 235, 0.12);
  opacity: 0;
  transform: scale(0.8) translateY(10px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
  overflow: hidden;
}

.plan-panel.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.plan-header {
  background: #2563eb;
  color: white;
  padding: 8px 18px;
  font-weight: 700;
  font-size: 14px;
}

.plan-body {
  padding: 12px 16px;
}

.plan-item {
  opacity: 0;
  transform: translateX(-8px);
  transition: all 0.4s ease;
  padding: 2px 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.plan-item.visible {
  opacity: 1;
  transform: translateX(0);
}

.plan-num {
  background: #2563eb;
  color: white;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

/* Summary panel */
.summary-panel {
  position: absolute;
  background: #ffffff;
  border: 2px solid #22c55e;
  border-radius: 16px;
  padding: 0;
  font-size: 13px;
  line-height: 1.8;
  box-shadow: 0 8px 32px rgba(34, 197, 94, 0.12);
  opacity: 0;
  transform: scale(0.5) rotate(-5deg);
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
  overflow: hidden;
}

.summary-panel.visible {
  opacity: 1;
  transform: scale(1) rotate(0deg);
}

.summary-header {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white;
  padding: 10px 18px;
  font-weight: 700;
  font-size: 15px;
}

.summary-body {
  padding: 14px 18px;
}

.summary-item {
  opacity: 0;
  transform: translateX(-8px);
  transition: all 0.4s ease;
  padding: 3px 0;
  font-size: 13px;
}

.summary-item.visible {
  opacity: 1;
  transform: translateX(0);
}

/* Long instruction text */
.long-text {
  position: absolute;
  background: #fff7ed;
  border: 2px solid #fb923c;
  border-radius: 14px;
  padding: 12px 16px;
  font-size: 12px;
  line-height: 1.7;
  color: #9a3412;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  opacity: 0;
  transform: scale(0.8) translateY(10px);
  transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 15;
}

.long-text.visible {
  opacity: 1;
  transform: scale(1) translateY(0);
}

/* Held tool */
.held-tool {
  position: absolute;
  top: 10px;
  right: -20px;
  font-size: 20px;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 11;
}

.held-tool.visible {
  opacity: 1;
  animation: tool-held-bounce 0.5s ease-out;
}

@keyframes tool-held-bounce {
  0% { transform: scale(0); }
  60% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* Ground shadow */
.ground-shadow {
  position: absolute;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 8px;
  background: radial-gradient(ellipse, rgba(0,0,0,0.08) 0%, transparent 70%);
  z-index: 5;
  transition: left 0.8s ease;
}

/* Confetti */
.confetti-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 30;
  overflow: hidden;
}

.confetti {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  opacity: 0;
}

.confetti.active {
  animation: confetti-fall 2s ease-out forwards;
}

@keyframes confetti-fall {
  0% { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translateY(400px) rotate(720deg) scale(0.5); }
}

/* Typing cursor animation */
@keyframes blink-cursor {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

.typing-cursor {
  display: inline-block;
  width: 2px;
  height: 18px;
  background: #60a5fa;
  margin-left: 2px;
  vertical-align: middle;
  animation: blink-cursor 0.8s ease-in-out infinite;
}

/* Controls */
.controls {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 8px 0 32px;
}

.btn {
  padding: 10px 24px;
  border: none;
  border-radius: 10px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(0);
}

.btn-primary {
  background: #2563eb;
  color: white;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
}

.btn-primary:hover {
  background: #1d4ed8;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
}

<script>
var STEPS = [
  { title: '第一步：重复的烦恼', key: 'frustration' },
  { title: '第二步：发现技能书', key: 'discover' },
  { title: '第三步：/commit 智能提交', key: 'commit' },
  { title: '第四步：/review 代码审查', key: 'review' },
  { title: '第五步：/plan 规划方案', key: 'plan' },
  { title: '第六步：技能的本质', key: 'essence' }
];

var currentStep = -1;
var autoPlayInterval = null;
var dynamicElements = [];

var stage = document.getElementById('stage');
var character = document.getElementById('character');
var stepTitle = document.getElementById('stepTitle');
var lightbulb = document.getElementById('lightbulb');
var exclamation = document.getElementById('exclamation');
var sweatDrop = document.getElementById('sweatDrop');
var heldTool = document.getElementById('heldTool');
var groundShadow = document.getElementById('groundShadow');
var confettiContainer = document.getElementById('confettiContainer');

function clearDynamic() {
  dynamicElements.forEach(function(el) {
    if (el && el.parentNode) el.parentNode.removeChild(el);
  });
  dynamicElements = [];

  character.className = 'character-wrapper idle pos-center';
  groundShadow.style.left = '50%';
  stepTitle.classList.remove('visible');
  lightbulb.classList.remove('on');
  exclamation.classList.remove('visible');
  sweatDrop.classList.remove('visible');
  heldTool.classList.remove('visible');
  heldTool.textContent = '';
  confettiContainer.innerHTML = '';
}

function createElement(tag, attrs, parent) {
  var el = document.createElement(tag);
  if (attrs) {
    Object.keys(attrs).forEach(function(k) {
      if (k === 'style' && typeof attrs[k] === 'object') {
        Object.assign(el.style, attrs[k]);
      } else if (k === 'className') {
        el.className = attrs[k];
      } else if (k === 'innerHTML') {
        el.innerHTML = attrs[k];
      } else if (k === 'textContent') {
        el.textContent = attrs[k];
      } else {
        el.setAttribute(k, attrs[k]);
      }
    });
  }
  (parent || stage).appendChild(el);
  dynamicElements.push(el);
  return el;
}

function delay(ms) {
  return new Promise(function(resolve) { setTimeout(resolve, ms); });
}

function updateProgress(step) {
  document.querySelectorAll('.progress-dot').forEach(function(dot, i) {
    dot.classList.toggle('active', i === step);
    dot.classList.toggle('completed', i < step);
  });
  document.querySelectorAll('.progress-line').forEach(function(line, i) {
    line.classList.toggle('completed', i < step);
  });
  document.getElementById('stepLabel').innerHTML = '步骤 <strong>' + (step + 1) + '</strong> / 6';
}

/* ===== STEP 0: Frustration - Repetitive long instructions ===== */
async function stepFrustration() {
  character.className = 'character-wrapper thinking pos-far-left';
  groundShadow.style.left = '22%';

  stepTitle.textContent = STEPS[0].title;
  await delay(200);

      '<div style="font-size:11px;line-height:1.8;color:#9a3412;word-break:break-all">' +
      '\u201c请检查代码风格，然后运行测试，确保覆盖率80%以上，最后提交到git，写好commit message，类型用feat，描述要详细，还要附上变更文件列表...\u201d' +
      '</div>'

    innerHTML: '<div style="font-size:11px;line-height:1.8;color:#9a3412;word-break:break-all">' +
      '\u201c请帮我审查这段代码，重点检查安全漏洞、错误处理、代码风格、命名规范，给出修改建议，按严重程度排序...\u201d' +
      '</div>'
  });

  await delay(700);
  longText2.classList.add('visible');

  // Tired bubble
  var tireBubble = createElement('div', {
    className: 'bubble tail-right',
    style: { left: '20px', bottom: '185px', maxWidth: '155px' },
    innerHTML: '\u6bcf\u6b21\u90fd\u8981\u5199\u8fd9\u4e48\u957f...<br>\u592a\u7d2f\u4e86 \ud83d\ude29'
  });

  await delay(800);
  tireBubble.classList.add('visible');

  character.className = 'character-wrapper thinking pos-far-left';
}

/* ===== STEP 1: Discover the Skill Book ===== */
async function stepDiscover() {

      '<div class="skill-card" data-idx="3"><span class="skill-card-cmd">/plan</span><span class="skill-card-divider"> \u2014 </span><span class="skill-card-desc">\u89c4\u5212\u65b9\u6848</span></div>' +

async function stepCommit() {

      '<div class="plan-item" data-idx="0"><div class="plan-num">1</div><span>\u5206\u6790\u9700\u6c42\u548c\u73b0\u6709\u4ee3\u7801\u7ed3\u6784</span></div>' +
      '<div class="plan-item" data-idx="1"><div class="plan-num">2</div><span>\u8bbe\u8ba1\u6570\u636e\u5e93 schema</span></div>' +
      '<div class="plan-item" data-idx="2"><div class="plan-num">3</div><span>\u5b9e\u73b0\u540e\u7aef API</span></div>' +
      '<div class="plan-item" data-idx="3"><div class="plan-num">4</div><span>\u7f16\u5199\u524d\u7aef\u9875\u9762</span></div>' +
      '<div class="plan-item" data-idx="4"><div class="plan-num">5</div><span>\u6dfb\u52a0\u6d4b\u8bd5\u7528\u4f8b</span></div>' +
      '<div class="plan-item" data-idx="5"><div class="plan-num">6</div><span>\u5b89\u5168\u5ba1\u67e5</span></div>' +
      '</div>'
  });

  await delay(600);
  planPanel.classList.add('visible');

  var planItems = planPanel.querySelectorAll('.plan-item');
  for (var i = 0; i < planItems.length; i++) {
    await delay(400);
    planItems[i].classList.add('visible');
  }

  // Character presents
  await delay(400);
  lightbulb.classList.remove('on');
  character.className = 'character-wrapper present pos-far-left';

  // Bubble
  var charBubble = createElement('div', {
    className: 'bubble tail-right',
    style: { left: '10px', bottom: '185px', maxWidth: '180px' },
    innerHTML: '<span style="font-weight:700;color:#2563eb">\u5148\u89c4\u5212\u540e\u6267\u884c\uff0c<br>\u6b65\u6b65\u6e05\u6670\uff01</span>'
  });

  await delay(500);
  charBubble.classList.add('visible');

  await delay(600);
  character.className = 'character-wrapper idle pos-far-left';
}

/* ===== STEP 5: The Essence of Skills ===== */
async function stepEssence() {
  character.className = 'character-wrapper present pos-far-left';
  groundShadow.style.left = '22%';

  stepTitle.textContent = STEPS[5].title;
  await delay(200);
  stepTitle.classList.add('visible');

  // Skill book in background with glow
  var bgBook = createElement('div', {
    className: 'skill-book glow',
    style: { left: '30px', top: '55px', width: '170px', zIndex: '3' },
    innerHTML: '<div class="skill-book-header" style="font-size:12px">\u26a1 Skills</div>' +
      '<div class="skill-book-body" style="padding:8px;min-height:50px"></div>'
  });
  bgBook.style.opacity = '0.2';
  bgBook.style.transform = 'scale(1)';

  // Summary panel
  var summaryPanel = createElement('div', {
    className: 'summary-panel',
    style: { right: '30px', top: '45px', width: '330px' },
    innerHTML: '<div class="summary-header">\u26a1 Skills \u6280\u80fd\u547d\u4ee4 \u2014 \u6838\u5fc3\u8981\u70b9</div>' +
      '<div class="summary-body">' +
      '<div class="summary-item" data-idx="0">\u26a1 Skill = \u5c01\u88c5\u597d\u7684\u590d\u6742\u64cd\u4f5c</div>' +
      '<div class="summary-item" data-idx="1">\ud83c\udfaf \u4e00\u53e5\u53e3\u4ee4 \u2192 \u591a\u6b65\u81ea\u52a8\u6267\u884c</div>' +
      '<div class="summary-item" data-idx="2">\ud83d\udce6 \u5185\u7f6e\u6280\u80fd + \u81ea\u5b9a\u4e49\u6280\u80fd</div>' +
      '<div class="summary-item" data-idx="3">\ud83d\udd27 Claude Code / Cursor / Copilot \u90fd\u6709\u7c7b\u4f3c\u6982\u5ff5</div>' +
      '<div class="summary-item" data-idx="4" style="margin-top:8px;padding-top:8px;border-top:1px dashed #e2e8f0;font-weight:700;color:#2563eb;font-size:14px">\ud83d\udca1 \u5584\u7528 Skills = 10\u500d\u6548\u7387\u63d0\u5347</div>' +
      '</div>'
  });

  await delay(500);
  summaryPanel.classList.add('visible');

  var summaryItems = summaryPanel.querySelectorAll('.summary-item');
  for (var i = 0; i < summaryItems.length; i++) {
    await delay(500);
    summaryItems[i].classList.add('visible');
  }

  // Celebration
  await delay(400);
  character.className = 'character-wrapper celebrate pos-far-left';

  // Confetti
  spawnConfetti();

  await delay(1500);
  character.className = 'character-wrapper idle pos-far-left';
}

function spawnConfetti() {
  var colors = ['#2563eb', '#22c55e', '#eab308', '#ef4444', '#a855f7', '#f97316'];
  for (var i = 0; i < 40; i++) {
    var c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (Math.random() * 100) + '%';
    c.style.top = '-10px';
    c.style.width = (4 + Math.random() * 6) + 'px';
    c.style.height = (4 + Math.random() * 6) + 'px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.animationDelay = (Math.random() * 0.8) + 's';
    c.style.animationDuration = (1.5 + Math.random() * 1) + 's';
    confettiContainer.appendChild(c);
    (function(el) {
      setTimeout(function() { el.classList.add('active'); }, 10);
    })(c);
  }
}

/* ===== Navigation ===== */
var stepFunctions = [stepFrustration, stepDiscover, stepCommit, stepReview, stepPlan, stepEssence];

async function goToStep(step) {
  if (step < 0 || step > 5) return;
  if (step === currentStep) return;

  currentStep = step;
  clearDynamic();
  updateProgress(step);

  var btnNext = document.getElementById('btnNext');
  btnNext.disabled = false;
  btnNext.textContent = step < 5 ? '\u4e0b\u4e00\u6b65' : '\u5b8c\u6210';
  if (step >= 5) {
    btnNext.disabled = true;
  }

  await stepFunctions[step]();
}

async function nextStep() {
  if (currentStep >= 5) return;
  await goToStep(currentStep + 1);
}

function prevStep(){if(!isAutoPlaying&&currentStep>0)goToStep(currentStep-1)}
function replay() {
  stopAutoPlay();
  currentStep = -1;
  clearDynamic();
  updateProgress(0);
  document.getElementById('btnNext').disabled = false;
  document.getElementById('btnNext').textContent = '\u4e0b\u4e00\u6b65';
  goToStep(0);
}

var isAutoPlaying = false;

function toggleAutoPlay() {
  if (isAutoPlaying) {
    stopAutoPlay();
  } else {
    startAutoPlay();
  }
}

function startAutoPlay() {
  isAutoPlaying = true;
  var btn = document.getElementById('btnAuto');
  btn.textContent = '\u6682\u505c\u64ad\u653e';
  btn.classList.add('playing');
  document.getElementById('btnNext').disabled = true;
  currentStep = -1; clearDynamic(); updateProgress(0);

  var advanceStep = async function() {
    if (!isAutoPlaying) return;
    if (currentStep >= 5) {
      stopAutoPlay();
      return;
    }
    await goToStep(currentStep < 0 ? 0 : currentStep + 1);
    if (isAutoPlaying) {
      autoPlayInterval = setTimeout(advanceStep, 4500);
    }
  };

  advanceStep();
}

function stopAutoPlay() {
  isAutoPlaying = false;
  if (autoPlayInterval) {
    clearTimeout(autoPlayInterval);
    autoPlayInterval = null;
  }
  var btn = document.getElementById('btnAuto');
  btn.textContent = '\u81ea\u52a8\u64ad\u653e';
  btn.classList.remove('playing');
  document.getElementById('btnNext').disabled = (currentStep >= 5);
}

// Keyboard support
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    if (!isAutoPlaying) nextStep();
  }
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (!isAutoPlaying && currentStep > 0) goToStep(currentStep - 1);
  }
  if (e.key === 'r' || e.key === 'R') {
    replay();
  }
});

// Start at step 0
goToStep(0);
</script>
