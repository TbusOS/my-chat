//==============================================================
// S11 · 帧缓冲
//==============================================================
let W=1,H=1,DPR=1;
let gbuf=null, aoA=null, aoB=null, lit=null, accum=null, frame=null, flow=null,
    bright=null, blurA=null, blurB=null, shadow=null;
function mkGBuffer(w,h){
  const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  const alb=mkTex(w,h,gl.RGBA,gl.RGBA8,gl.UNSIGNED_BYTE,gl.NEAREST);
  const nrm=mkTex(w,h,gl.RGBA,gl.RGBA16F,gl.HALF_FLOAT,gl.NEAREST);
  const dep=mkTex(w,h,gl.DEPTH_COMPONENT,gl.DEPTH_COMPONENT24,gl.UNSIGNED_INT,gl.NEAREST);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,alb,0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT1,gl.TEXTURE_2D,nrm,0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,dep,0);
  gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
  const st=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if(st!==gl.FRAMEBUFFER_COMPLETE) fatal('G-buffer 创建失败 (0x'+st.toString(16)+')');
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {fb, alb, nrm, dep, tex:[alb,nrm,dep], w, h};
}
const SHADOW_RES=2048;
function mkShadow(){
  const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.DEPTH_COMPONENT24,SHADOW_RES,SHADOW_RES,0,
    gl.DEPTH_COMPONENT,gl.UNSIGNED_INT,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_MODE,gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_FUNC,gl.LEQUAL);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,t,0);
  gl.drawBuffers([gl.NONE]); gl.readBuffer(gl.NONE);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {fb, t};
}
function resize(){
  const scale = QUAL.renderScale;
  DPR = Math.min(window.devicePixelRatio||1, 2) * scale;
  const w = Math.max(2, Math.round(cv.clientWidth*DPR));
  const h = Math.max(2, Math.round(cv.clientHeight*DPR));
  if(w===W && h===H) return;
  W=w; H=h; cv.width=W; cv.height=H;
  [gbuf,aoA,aoB,lit,accum,frame,flow,bright,blurA,blurB].forEach(f=>{
    if(!f) return;
    if(f.alb){ gl.deleteFramebuffer(f.fb); f.tex.forEach(t=>gl.deleteTexture(t)); }
    else delFBO(f);
  });
  gbuf = mkGBuffer(W,H);
  const R8 ={fmt:gl.RED, ifmt:gl.R8,     type:gl.UNSIGNED_BYTE, filter:gl.LINEAR};
  const F16={fmt:gl.RGBA,ifmt:gl.RGBA16F,type:gl.HALF_FLOAT,    filter:gl.LINEAR};
  const F32={fmt:gl.RGBA,ifmt:gl.RGBA32F,type:gl.FLOAT,         filter:gl.NEAREST};
  aoA  = mkFBO(W,H,[R8]);
  aoB  = mkFBO(W,H,[R8]);
  lit  = mkFBO(W,H,[F16]);
  accum= mkFBO(W,H,[F32]);
  frame= mkFBO(W,H,[F16]);
  flow = mkFlowFBO(W,H);
  bright=mkFBO(W>>1,H>>1,[F16]);
  blurA =mkFBO(W>>2,H>>2,[F16]);
  blurB =mkFBO(W>>2,H>>2,[F16]);
  reset();
}

//==============================================================
// S12 · 渲染
//==============================================================
const QUAL = { renderScale:1.0, maxSPP:200, micro:1, bloom:0.022, sharp:0.22,
               grain:0.0055, vig:0.22, ca:0.0006, aoInt:0.92, aoRad:0.85 };
const LIGHT_AXIS = V3.norm([-0.34, 0.88, 0.33]);
const LIGHT_HU = 0.46, LIGHT_HV = 0.30;   // 与 STUDIO_GLSL 里的主光尺寸一致
const ENV_INT = 1.0, KEY_FRAC = 0.80;

let PR={};
let spp=0, dirty=true, lastMs=0, totalTris=0;
function reset(){ spp=0; dirty=true; }

function lightVP(i){
  // 在柔光箱面积内抖动光源方向 —— 累积后自然收敛成真实半影
  let dir=LIGHT_AXIS;
  if(i>0){
    const t=V3.norm(V3.cross([0,0,1], LIGHT_AXIS));
    const b=V3.cross(LIGHT_AXIS,t);
    const u=(halton(i,2)*2-1)*LIGHT_HU, v=(halton(i,3)*2-1)*LIGHT_HV;
    dir=V3.norm([LIGHT_AXIS[0]+t[0]*u+b[0]*v,
                 LIGHT_AXIS[1]+t[1]*u+b[1]*v,
                 LIGHT_AXIS[2]+t[2]*u+b[2]*v]);
  }
  const R=Math.min(Math.max(cam.dist*0.85, 14), 115);
  const c=cam.tgt;
  const eye=[c[0]+dir[0]*260, c[1]+dir[1]*260, c[2]+dir[2]*260];
  const V=M4.look(eye,c,[0,1,0]);
  const P=M4.ortho(-R,R,-R,R, 40, 520);
  return {vp:M4.mul(P,V), dir};
}
function camMats(i){
  const eye=camEye();
  const V=M4.look(eye,cam.tgt,[0,1,0]);      // 中心相机(不抖)
  let Vj=V, e=eye;
  if(i>0 && cam.ap>0){
    // 薄透镜 = 镜头在光圈盘上平移 + 一个剪切,让焦平面上的点投到同一像素
    // (Haeberli & Akeley 1990 累积缓冲景深;焦平面允许任意朝向 → 顺带得到移轴)
    const r=Math.sqrt(halton(i,5)), th=halton(i,7)*Math.PI*2;
    const dx=Math.cos(th)*r*cam.ap, dy=Math.sin(th)*r*cam.ap;
    // 相机右/上轴(世界系) = 视图矩阵旋转部分的前两行
    e=[eye[0]+V[0]*dx+V[1]*dy, eye[1]+V[4]*dx+V[5]*dy, eye[2]+V[8]*dx+V[9]*dy];
    // 焦平面(相机系): n·c = d
    let n, d;
    if(cam.focus==='plane'){
      // 世界里 y = fy 的水平面 → 相机系法线是旋转矩阵第二列
      n=[V[4],V[5],V[6]];
      const c0=[V[4]*cam.fy+V[12], V[5]*cam.fy+V[13], V[6]*cam.fy+V[14]];
      d=n[0]*c0[0]+n[1]*c0[1]+n[2]*c0[2];
    } else {
      n=[0,0,-1]; d=cam.dist;                 // 垂直视线,距离 = 到目标点
    }
    const k=1/(d-(n[0]*dx+n[1]*dy));
    // T: 相机系里平移 -Δ;N: 剪切 c' + Δ·(n·c')·k
    const T=M4.ident(); T[12]=-dx; T[13]=-dy;
    const N=M4.ident();
    N[0]+=dx*n[0]*k; N[4]+=dx*n[1]*k; N[8]+=dx*n[2]*k;
    N[1]+=dy*n[0]*k; N[5]+=dy*n[1]*k; N[9]+=dy*n[2]*k;
    Vj=M4.mul(N, M4.mul(T, V));
  }
  const P=M4.persp(cam.fov*Math.PI/180, W/H, Math.max(cam.dist*0.02,0.05), cam.dist*14+400);
  if(i>0){
    // 亚像素抖动用高斯(σ≈0.32px)而不是均匀 ±0.5px:
    // 均匀抖动累积后等价于 1 像素盒式模糊,画面必软;窄高斯抗锯齿同时保锐
    const u1=Math.max(halton(i,11),1e-6), u2=halton(i,13);
    const r=Math.sqrt(-2*Math.log(u1))*0.32, th=2*Math.PI*u2;
    const jx=Math.max(-1,Math.min(1,r*Math.cos(th)));
    const jy=Math.max(-1,Math.min(1,r*Math.sin(th)));
    P[8]+= jx*2/W;
    P[9]+= jy*2/H;
  }
  return {vp:M4.mul(P,Vj), eye:e};
}
let culled=0, drawnTris=0;
function drawScene(program, isShadow, vp){
  const F=vp?frustum(vp):null;
  for(const m of SCENE){
    if(!m.count) continue;
    if(F && m.br && !sphereIn(F,m.bc,m.br)){ culled++; continue; }
    drawnTris+=m.tris*m.count;
    gl.bindVertexArray(m.vao);
    if(!isShadow) gl.uniform3fv(program.u.uHalf, m.half);
    gl.drawElementsInstanced(gl.TRIANGLES, m.n, m.type, 0, m.count);
  }
  gl.bindVertexArray(null);
}
function renderSample(i){
  const {vp:LVP, dir:LDIR}=lightVP(i);
  const {vp:VP, eye}=camMats(i);
  const invVP=M4.inv(VP);
  lastVP=VP; lastEye=eye;

  // 1) 阴影深度
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadow.fb);
  gl.viewport(0,0,SHADOW_RES,SHADOW_RES);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LESS); gl.depthMask(true);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.FRONT);
  gl.useProgram(PR.shadow);
  gl.uniformMatrix4fv(PR.shadow.u.uLVP,false,LVP);
  gl.uniform1f(PR.shadow.u.uLift,STATE.lift); gl.uniform1f(PR.shadow.u.uCutX,STATE.cutX);
  culled=0; drawnTris=0;
  drawScene(PR.shadow,true,LVP);
  gl.disable(gl.CULL_FACE);        // G-buffer 不剔除背面:剖开后要看见内壁  CHK('pass.shadow');

  // 2) G-buffer
  gl.bindFramebuffer(gl.FRAMEBUFFER, gbuf.fb);
  gl.viewport(0,0,W,H);
  gl.clearColor(0,0,0,0);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.useProgram(PR.gb);
  gl.uniformMatrix4fv(PR.gb.u.uVP,false,VP);
  gl.uniform1f(PR.gb.u.uMicro, QUAL.micro);
  gl.uniform1f(PR.gb.u.uLift,STATE.lift); gl.uniform1f(PR.gb.u.uCutX,STATE.cutX);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, ATLAS_TEX);
  gl.uniform1i(PR.gb.u.uAtlas,0);
  drawScene(PR.gb,false,VP);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);  CHK('pass.gbuffer');

  // 3) SSAO + 双边模糊
  gl.bindFramebuffer(gl.FRAMEBUFFER, aoA.fb); gl.viewport(0,0,W,H);
  gl.useProgram(PR.ssao);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,gbuf.nrm);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,gbuf.dep);
  gl.uniform1i(PR.ssao.u.uNrm,0); gl.uniform1i(PR.ssao.u.uDep,1);
  gl.uniformMatrix4fv(PR.ssao.u.uVP,false,VP);
  gl.uniformMatrix4fv(PR.ssao.u.uInvVP,false,invVP);
  gl.uniform3fv(PR.ssao.u.uCam,eye);
  gl.uniform2f(PR.ssao.u.uRes,W,H);
  gl.uniform1f(PR.ssao.u.uRadius,QUAL.aoRad);
  gl.uniform1f(PR.ssao.u.uIntensity,QUAL.aoInt);
  gl.uniform1f(PR.ssao.u.uRot, i*2.39996);
  gl.uniform1f(PR.ssao.u.uSamples, (i<3?6.0:14.0));   // 头几帧先粗后细
  blit();
  // 累积够几帧后噪声自己收敛,不再模糊 → 接触阴影边缘保持锐利
  for(const [src,dst,dx,dy] of (i<6 ? [[aoA,aoB,1,0],[aoB,aoA,0,1]] : [])){
    gl.bindFramebuffer(gl.FRAMEBUFFER,dst.fb);
    gl.useProgram(PR.blur);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src.t);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,gbuf.dep);
    gl.uniform1i(PR.blur.u.uSrc,0); gl.uniform1i(PR.blur.u.uDep,1);
    gl.uniform2f(PR.blur.u.uDir, dx/W, dy/H);
    blit();
  }
  CHK('pass.ssao');

  // 4) 光照
  gl.bindFramebuffer(gl.FRAMEBUFFER, lit.fb); gl.viewport(0,0,W,H);
  gl.useProgram(PR.light);
  const bind=(unit,tex,name,cube)=>{ gl.activeTexture(gl.TEXTURE0+unit);
    gl.bindTexture(cube?gl.TEXTURE_CUBE_MAP:gl.TEXTURE_2D,tex);
    gl.uniform1i(PR.light.u[name],unit); };
  bind(0,gbuf.alb,'uAlb'); bind(1,gbuf.nrm,'uNrm'); bind(2,gbuf.dep,'uDep');
  bind(3,aoA.t,'uAO');     bind(4,ENV.lut,'uLut');
  bind(5,ENV.irr,'uIrr',1);bind(6,ENV.spec,'uSpec',1); bind(7,ENV.raw,'uRaw',1);
  bind(8,shadow.t,'uShadow');
  gl.uniformMatrix4fv(PR.light.u.uInvVP,false,invVP);
  gl.uniformMatrix4fv(PR.light.u.uLVP,false,LVP);
  gl.uniform3fv(PR.light.u.uCam,eye);
  gl.uniform3fv(PR.light.u.uLightDir,LDIR);
  gl.uniform1f(PR.light.u.uKeyFrac,KEY_FRAC);
  gl.uniform1f(PR.light.u.uEnvInt,ENV_INT);
  gl.uniform1f(PR.light.u.uMips,ENV_MIPS);
  blit(); CHK('pass.light');

  // 5) 累积平均
  gl.bindFramebuffer(gl.FRAMEBUFFER, accum.fb);
  gl.useProgram(PR.copy);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,lit.t);
  gl.uniform1i(PR.copy.u.uSrc,0);
  if(i===0){ gl.disable(gl.BLEND); }
  else {
    gl.enable(gl.BLEND);
    gl.blendColor(0,0,0, 1/(i+1));
    gl.blendFunc(gl.CONSTANT_ALPHA, gl.ONE_MINUS_CONSTANT_ALPHA);
  }
  blit();
  gl.disable(gl.BLEND);
  CHK('pass.accum');
}
function composite(){
  // 写实底层 + 数据流叠加层
  gl.bindFramebuffer(gl.FRAMEBUFFER,frame.fb); gl.viewport(0,0,W,H);
  gl.useProgram(PR.combine);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,accum.t);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,flow.t);
  gl.uniform1i(PR.combine.u.uA,0); gl.uniform1i(PR.combine.u.uB,1); gl.uniform1f(PR.combine.u.uBOn,FLOW.on);
  blit();
  // 泛光
  gl.bindFramebuffer(gl.FRAMEBUFFER,bright.fb); gl.viewport(0,0,bright.w,bright.h);
  gl.useProgram(PR.bright);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,frame.t);
  gl.uniform1i(PR.bright.u.uSrc,0); gl.uniform1f(PR.bright.u.uThr,1.0);
  blit();
  let src=bright;
  const bloomIters=(spp<QUAL.maxSPP && spp>6)?1:2;
  for(let k=0;k<bloomIters;k++){
    gl.bindFramebuffer(gl.FRAMEBUFFER,blurA.fb); gl.viewport(0,0,blurA.w,blurA.h);
    gl.useProgram(PR.gauss);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src.t);
    gl.uniform1i(PR.gauss.u.uSrc,0); gl.uniform2f(PR.gauss.u.uDir,1/blurA.w,0);
    blit();
    gl.bindFramebuffer(gl.FRAMEBUFFER,blurB.fb);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,blurA.t);
    gl.uniform2f(PR.gauss.u.uDir,0,1/blurA.h);
    blit();
    src=blurB;
  }
  // 最终合成
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,W,H);
  gl.useProgram(PR.post);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,frame.t);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,src.t);
  gl.uniform1i(PR.post.u.uSrc,0); gl.uniform1i(PR.post.u.uBloom,1);
  gl.uniform1f(PR.post.u.uExposure,cam.ex);
  gl.uniform1f(PR.post.u.uBloomStr,QUAL.bloom);
  gl.uniform1f(PR.post.u.uGrain,QUAL.grain);
  gl.uniform1f(PR.post.u.uVig,QUAL.vig);
  gl.uniform1f(PR.post.u.uCA,QUAL.ca);
  gl.uniform1f(PR.post.u.uSharp,QUAL.sharp);
  gl.uniform2f(PR.post.u.uPx,1/W,1/H);
  blit();
  CHK('pass.post');
}


//==============================================================
// S12b · 数据流叠加层
//   写实底层照常累积;这一层每个显示帧单独画到自己的 HDR 缓冲,
//   深度用 G-buffer 的深度只测不写,再与累积结果相加进泛光。
//   颜色纪律:命令=琥珀 · 数据=青 · 像素=洋红;几何本体绝不发光。
//==============================================================
const FLOW_VS = `#version 300 es
layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNrm;
layout(location=2) in vec3 iPos; layout(location=3) in vec3 iScl; layout(location=4) in vec3 iCol;
layout(location=5) in vec4 iMat;   // yaw, 强度, 边缘柔和度, -
uniform mat4 uVP;
out vec3 vN; out vec3 vW; out vec3 vCol; out float vInt; out float vSoft;
void main(){
  float c=cos(iMat.x), s=sin(iMat.x);
  vec3 sp=aPos*iScl;
  vec3 rp=vec3(sp.x*c+sp.z*s, sp.y, -sp.x*s+sp.z*c);
  vec3 nn=normalize(aNrm/max(iScl,vec3(1e-4)));
  vN=vec3(nn.x*c+nn.z*s, nn.y, -nn.x*s+nn.z*c);
  vW=iPos+rp; vCol=iCol; vInt=iMat.y; vSoft=iMat.z;
  gl_Position=uVP*vec4(vW,1.0);
}`;
const FLOW_FS = `#version 300 es
precision highp float;
in vec3 vN; in vec3 vW; in vec3 vCol; in float vInt; in float vSoft;
uniform vec3 uCam; out vec4 o;
void main(){
  vec3 N=normalize(vN); vec3 V=normalize(uCam-vW);
  float ndv=max(dot(N,V),0.0);
  // 光球:中心亮、边缘柔(不是圆角盒那种一格一格的 rim);垫片:均匀
  float k = vSoft>0.5 ? pow(ndv,1.6)*1.45 : 1.0;
  o=vec4(vCol*vInt*k, 1.0);
}`;
const COMBINE_FS = `#version 300 es
precision highp float;
in vec2 vUV; out vec4 o; uniform sampler2D uA, uB; uniform float uBOn;
void main(){ o=vec4(texture(uA,vUV).rgb + uBOn*texture(uB,vUV).rgb, 1.0); }`;

const FLOW={ box:null, orb:null, flat:null, list:[], on:0, live:{} };
const FC={ cmd:[1.0,0.60,0.16], data:[0.22,0.82,1.0], px:[1.0,0.32,0.72] };
let lastVP=null, lastEye=[0,0,0];
function mkFlowFBO(w,h){
  const fb=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  const t=mkTex(w,h,gl.RGBA,gl.RGBA16F,gl.HALF_FLOAT,gl.LINEAR);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,gbuf.dep,0);
  const st=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if(st!==gl.FRAMEBUFFER_COMPLETE) fatal('叠加层帧缓冲创建失败 (0x'+st.toString(16)+')');
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  return {fb, tex:[t], t, w, h};
}
// —— 几何小工具 ——
const V=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const dist3=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
function pathAt(pts,u){
  u=Math.max(0,Math.min(0.99999,u));
  let L=0; const seg=[]; for(let i=0;i<pts.length-1;i++){ const d=dist3(pts[i],pts[i+1]); seg.push(d); L+=d; }
  let s=u*L;
  for(let i=0;i<seg.length;i++){ if(s<=seg[i]) return V(pts[i],pts[i+1],seg[i]>0?s/seg[i]:0); s-=seg[i]; }
  return pts[pts.length-1].slice();
}
const pulse=(T,period,ph)=>0.5+0.5*Math.sin((T/period+(ph||0))*6.2831853);
function glow(p,scl,col,inten){ FLOW.list.push({p, s:scl, c:col, me:inten, ro:0.0, orb:0}); }
function packets(T,pts,n,period,col,size,ph){
  for(let i=0;i<n;i++){ const u=((T/period)+i/n+(ph||0))%1;
    FLOW.list.push({p:pathAt(pts,u), s:[size,size,size], c:col, me:3.0, ro:1.0, orb:1}); }
}
function ribbon(pts,col,inten,w){
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1]; const dx=b[0]-a[0], dz=b[2]-a[2]; const len=Math.hypot(dx,dz);
    if(len<1e-3) continue;
    FLOW.list.push({p:V(a,b,0.5), s:[len,0.06,w], c:col, me:inten, yaw:Math.atan2(dz,dx), ro:0.0, orb:0});
  }
}
// ---------- 全局时钟:数据按"拍"走,可暂停 / 单步 / 调速 ----------
const CLK={ t:0, speed:1.0, playing:true, last:0, tps:1.4 };   // tps = 每秒几拍
function clockStep(now){
  if(!CLK.last) CLK.last=now;
  if(CLK.playing) CLK.t += (now-CLK.last)/1000*CLK.tps*CLK.speed;
  CLK.last=now;
}
const tick =()=>Math.floor(CLK.t);
const phase=()=>CLK.t-Math.floor(CLK.t);
const h1=(a,b,c)=>{ const x=Math.sin(a*12.9898+b*78.233+(c||0)*37.719)*43758.5453; return x-Math.floor(x); };
const ease=(x)=>x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2;

// ---------- 数据对象原语(全部落到叠加层) ----------
// 平片(无圆角):通用"格子"
function pad(p,sx,sz,col,inten,yaw){ FLOW.list.push({p, s:[sx,0.02,sz], c:col, me:inten, yaw:yaw||0, ro:0.0, orb:0, flat:1}); }
// 一行 n 位:亮 = 1,暗 = 0;dir 为行方向(弧度,0 = +x)
function wordRow(center,yaw,nbits,pitch,bitFn,col,inten,cellW){
  const dx=Math.cos(yaw), dz=-Math.sin(yaw);
  for(let i=0;i<nbits;i++){
    const o=(i-(nbits-1)/2)*pitch;
    const on=bitFn(i);
    pad([center[0]+dx*o, center[1], center[2]+dz*o], cellW||pitch*0.72, cellW?cellW*1.6:pitch*0.72*1.6, col, inten*(on?1.0:0.12), yaw+Math.PI/2);
  }
}
// n 根并行导线(xz 平面内,a→b,垂直方向等距展开)
function wires(a,b,n,spacing,col,inten,w){
  const dx=b[0]-a[0], dz=b[2]-a[2], len=Math.hypot(dx,dz); if(len<1e-3) return;
  const yaw=Math.atan2(dz,dx);
  const nx=-dz/len, nz=dx/len;            // 垂直单位向量
  for(let i=0;i<n;i++){
    const o=(i-(n-1)/2)*spacing;
    FLOW.list.push({p:[(a[0]+b[0])/2+nx*o,(a[1]+b[1])/2,(a[2]+b[2])/2+nz*o], s:[len,0.02,w||0.10], c:col, me:inten, yaw, ro:0.0, orb:0, flat:1});
  }
}
// 沿导线束移动的一行位(u∈[0,1] 沿 a→b)
function wordOnWires(a,b,u,n,spacing,bitFn,col,inten){
  const p=V(a,b,u); const dx=b[0]-a[0], dz=b[2]-a[2], len=Math.hypot(dx,dz);
  const yaw=Math.atan2(dz,dx);
  wordRow(p, yaw+Math.PI/2, n, spacing, bitFn, col, inten, spacing*0.8);
}
// 一块(缓存行 / 矩阵 / 帧缓冲片)网格
function gridObj(center,yaw,cols,rows,cell,colFn,inten){
  const cy=Math.cos(yaw), sy=-Math.sin(yaw);
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const ox=(i-(cols-1)/2)*cell, oz=(j-(rows-1)/2)*cell;
    const c=colFn(i,j); if(!c) continue;
    pad([center[0]+ox*cy-oz*sy, center[1], center[2]+ox*sy+oz*cy], cell*0.9, cell*0.9, c.col||c, c.inten!=null?c.inten:inten, yaw);
  }
}
// 一张"卡"(命令 / 指令):底板 + 三条短线
function cardObj(p,yaw,col,inten,scale){
  const s=scale||1;
  pad(p,3.0*s,2.0*s,col,inten*0.35,yaw);
  const cy=Math.cos(yaw), sy=-Math.sin(yaw);
  for(let k=0;k<3;k++){ const oz=(k-1)*0.55*s, ox=-0.2*s;
    pad([p[0]+ox*cy-oz*sy, p[1]+0.03, p[2]+ox*sy+oz*cy], 1.8*s, 0.22*s, col, inten, yaw); }
}

// ---------- die 内部"城"的路径工具 ----------
const C0=CITY_ORIGIN, RY=C0[1]+12+1.9;
const cp2=(x,y,z)=>[x,y,z];              // 板级坐标直通
const C0x=(x)=>x, C0y=(y)=>y, C0z=(z)=>z;                  // 轨上数据的高度
const cp=(x,z,y)=>[C0[0]+x, (y==null?RY:C0[1]+y), C0[2]+z];
// 把一串点铺成折线并按 u 取位置(pathAt 已有)。这里给几条常用路线:
function routeSM2L2(smx,smz,k){          // 某个 SM → L2 第 k 片(经 GPC 分配轨 → 竖轨 → 路由 → 主干)
  const sx=Math.sign(smx), sz=Math.sign(smz), lx=-98+k*28;
  return [cp(smx,smz,5.6), cp(smx,sz*82.5), cp(sx*82.5,sz*82.5), cp(sx*82.5,sz*12), cp(lx,sz*12), cp(lx,0), cp(lx,0,5.6)];
}
function routeL22MC(k,mx,mz){            // L2 第 k 片 → 显存控制器(mx, ±108)
  const lx=-98+k*28, sz=Math.sign(mz);
  return [cp(lx,0,5.6), cp(lx,sz*12), cp(mx,sz*12), cp(mx,sz*103), cp(mx,sz*108,5.6)];
}
function routeMC2GDDR(mx,mz,dx){         // 控制器 → 片外颗粒(沿 32 根走线)
  const sz=Math.sign(mz);
  return [cp(mx,sz*108,5.6), cp(mx+dx,sz*120,0.9), cp(mx+dx,sz*150,2.4)];
}
const rev=(P)=>P.slice().reverse();
// 数据块(缓存行 / 帧行)沿路径:cols×rows 位格
function tileAlong(P,u,cols,rows,col,seed,inten){
  const p=pathAt(P,u);
  gridObj(p,0,cols,rows,1.45,(i,j)=>({col,inten:(inten||1.4)*1.5*(h1(seed,i,j)>0.5?1:0.22)}),1);
  glow([p[0],p[1]-0.3,p[2]],[cols*1.45+1.2,0.02,rows*1.45+1.2],col,0.25);   // 底下一层淡光,远看也有形
}
function tokenAlong(P,u,col){ const p=pathAt(P,u); cardObj(p,0,col,2.6,1.9); FLOW.list.push({p:[p[0],p[1]+0.9,p[2]],s:[2.2,2.2,2.2],c:col,me:1.6,ro:1.0,orb:1}); }
function blockGlow(p,sx,sz,col,inten){ glow([p[0],p[1]+0.05,p[2]],[sx,0.02,sz],col,inten); }
// 背景流量:让交叉开关看起来一直有别的 SM 在用
function crossbarTraffic(T,n){
  for(let i=0;i<n;i++){
    const seed=i*31+7, lane=(i%2)?'spineU':'spineL', sz=lane==='spineU'?-1:1;
    const u=((T*0.18*(0.6+0.8*h1(seed,1)))+h1(seed,2))%1;
    const dir=h1(seed,3)>0.5?1:-1;
    const x=-115+(dir>0?u:1-u)*230;
    gridObj(cp(x,sz*12),0,4,2,1.2,(a,b)=>({col:FC.data,inten:0.9*(h1(seed,a,b)>0.5?1:0.25)}),1);
  }
}

// —— 各站的数据流 ——
function buildFlow(kind,T){
  FLOW.list.length=0; FLOW.live={};
  const S0=SM_ORIGIN, top=S0[1]+0.8, partX=[-17,-5.7,5.7,17];
  if(kind==='cmd'){
    // ===== 命令进门:主板 → 16 条 PCIe 通道 → 命令处理器 → 工作分配器 → 沿交叉开关分给 4 个 GPC → 落进 SM =====
    const tk=tick(), ph=phase(), step=tk%12, u=ph;
    const host=cp(-160,60,3.2), pcie=cp(-124,60,5.6), cpB=cp(-102,62,5.6), wd=cp(-102,36,5.6);
    if(step<2){            // 一张命令卡被切成 16 片,走 16 条通道并行进来
      const uu=(step+u)/2;
      for(let l=0;l<16;l++){ const z=60+(l-7.5)*1.3;
        pad(V(cp(-160,z,0.9),cp(-129,z,0.9),uu),1.6,0.7,FC.cmd,2.0); }
      blockGlow(host,28,28,FC.cmd,0.15+0.3*u);
    } else if(step<3){     // PCIe 块里拼回一张卡,交给命令处理器
      cardObj(V(pcie,cpB,ease(u)),0,FC.cmd,2.2,0.9); blockGlow(pcie,10,44,FC.cmd,0.5);
    } else if(step<4){     // 命令处理器 → 工作分配器
      cardObj(V(cpB,wd,ease(u)),0,FC.cmd,2.2,0.9); blockGlow(cpB,14,12,FC.cmd,0.6);
    } else if(step<10){    // 工作分配器切成 4 份,沿主干到 4 个路由节点,再下到各 SM
      blockGlow(wd,22,14,FC.cmd,0.4);
      const q=(step-4+u)/6;
      for(const sx of [-1,1]) for(const sz of [-1,1]){
        const P=[wd, cp(-102,30), cp(-102,sz*12), cp(sx*82.5,sz*12), cp(sx*82.5,sz*82.5)];
        const qq=Math.min(1,q*1.35);
        if(qq<1) tokenAlong(P,qq,FC.cmd);
        // 到了分配轨:8 个 SM 依次点亮开工
        if(q>0.72){ const w=(q-0.72)/0.28;
          POS.city.sm.forEach(p=>{ if(Math.sign(p[0]-C0[0])!==sx||Math.sign(p[2]-C0[2])!==sz) return;
            const idx=Math.floor(Math.abs(p[0]-C0[0])/15)+ (Math.abs(p[2]-C0[2])>80?4:0);
            const on=w*8>idx? 0.9:0.0; blockGlow(p,12,12,FC.data,on); }); }
      }
      // 主干上被切成 4 份的样子
      for(const sx of [-1,1]) for(const sz of [-1,1]) glow(POS.city.router[(sx>0?2:0)+(sz>0?1:0)],[10.4,0.02,9.4],FC.cmd,q>0.45?0.6:0.1);
    } else {               // 全部 32 个 SM 在忙
      POS.city.sm.forEach((p,i)=>blockGlow(p,12,12,FC.data,0.5+0.5*h1(tk,i)));
    }
    crossbarTraffic(T,6);
    const stage=['①命令卡切成 16 片走 PCIe ×16','①命令卡切成 16 片走 PCIe ×16','②PCIe 块拼回整卡 → 命令处理器','③命令处理器解析 → 工作分配器',
      '④工作分配器切成 4 份工作包','④沿交叉开关送到 4 个 GPC 路由节点','④拐进 GPC 竖轨','④到 SM 之间的分配轨','⑤逐个落进 SM','⑤逐个落进 SM','⑥32 个 SM 同时开工','⑥32 个 SM 同时开工'][step];
    FLOW.live.cmd=`第 ${step+1}/12 拍 · <b>${stage}</b>`;
    FLOW.live.gpc=`每个 GPC 8 个 SM 共用一个路由节点<br>工作包到节点后沿分配轨依次发到每个 SM`;
  }
  else if(kind==='mem'){
    // ===== 显存搬运(芯片内部):请求 → L2 切片(按地址选片) → 未命中 → 控制器 → 片外颗粒 → 数据一路返回 =====
    const tk=tick(), ph=phase(), step=tk%8, u=ph;
    const k=2, mx=-70, mz=-108, dx=-14;                     // 地址哈希落到第 2 片;控制器 0;颗粒 0
    const P1=routeSM2L2(-60,-70,k), P2=routeL22MC(k,mx,mz), P3=routeMC2GDDR(mx,mz,dx);
    const sm=cp(-60,-70,5.6), l2=POS.city.l2[k], mc=POS.city.mc[0], gd=cp(mx+dx,-150,2.4);
    blockGlow(sm,12,12,FC.data,0.25);
    if(step<2){ tokenAlong(P1,(step+u)/2,FC.cmd); }
    else if(step<3){ blockGlow(l2,20,14,[1.0,0.35,0.3],0.7*(1-u)); tokenAlong(P2,u*0.5,FC.cmd); }
    else if(step<4){ tokenAlong(P2,0.5+u*0.5,FC.cmd); blockGlow(mc,18,10,FC.cmd,0.4); }
    else if(step<5){ tokenAlong(P3,u,FC.cmd); blockGlow(gd,19,24,FC.data,0.3+0.5*u); }
    else if(step<6){       // 颗粒吐出 8 个 32 位字,沿 32 根走线回控制器
      for(let w=0;w<8;w++){ const uu=Math.min(1,Math.max(0,(u*1.6-w*0.08)));
        wordOnWires(cp(mx+dx,-150,0.9),cp(mx+dx,-120,0.9),uu,32,0.55,(b)=>h1(tk,w,b)>0.5,FC.data,1.6); }
      blockGlow(gd,19,24,FC.data,0.9);
    }
    else if(step<7){ tileAlong(rev(P2),u,8,4,FC.data,tk,1.4); blockGlow(mc,18,10,FC.data,0.6*(1-u)); }
    else { tileAlong(rev(P1),u,8,4,FC.data,tk,1.4); blockGlow(l2,20,14,FC.data,0.6); if(u>0.9) blockGlow(sm,12,12,FC.data,1.2); }
    crossbarTraffic(T,8);
    const stage=['①SM 发出读请求(带地址)','①沿分配轨 → 路由 → 交叉开关','②地址哈希选到 L2 第 3 片 → <span style="color:#ff8a80">未命中</span>','③转给显存控制器 0',
      '④控制器向 GDDR 颗粒发读命令','⑤颗粒沿 32 根线连发 8 个字 = 256 位','⑥控制器拼成一条缓存行,回填 L2','⑦L2 沿原路把数据送回 SM'][step];
    FLOW.live.mem=`第 ${step+1}/8 拍 · <b>${stage}</b>`;
    FLOW.live.l2=`8 片 L2 按地址哈希分片<br>任何 SM 都能到任何片 → 需要交叉开关`;
    FLOW.live.mc=`控制器把颗粒的 8 个 32 位字拼成 256 位缓存行<br>这是 GPU 里最长的一趟路`;
  }
  else if(kind==='pipe'){
    // ===== 图形流水线(芯片内部):顶点数据 → SM 顶点着色 → 光栅引擎切成片元 → SM 片元着色 → ROP → 控制器 → 帧缓冲 =====
    const tk=tick(), ph=phase(), step=tk%12, u=ph;
    const k=5, l2=POS.city.l2[k], smV=cp(-75,-70,5.6), ras=POS.city.rop[0], smF=[cp(-60,-95,5.6),cp(-75,-95,5.6),cp(-90,-95,5.6),cp(-105,-95,5.6)];
    const mc=POS.city.mc[0], gd=cp(-84,-150,2.4);
    const Pv=rev(routeSM2L2(-75,-70,k));                          // L2 → SM(顶点)
    const Pr=[smV, cp(-75,-82.5), cp(-82.5,-82.5), cp(-82.5,-60), [ras[0],ras[1],ras[2]]];
    const Pf=(i)=>[[ras[0],ras[1],ras[2]], cp(-82.5,-60), cp(-82.5,-82.5), cp(-60-15*i,-82.5), smF[i]];
    const Pm=[[ras[0],ras[1],ras[2]], cp(-82.5,-60), cp(-82.5,-12), cp(-70,-12), cp(-70,-103), mc];
    const Pg=routeMC2GDDR(-70,-108,-14);
    // 三个顶点画成大光球,连成一个真三角形
    const tri=(pts,col,inten)=>{ for(let a=0;a<3;a++){ const b=(a+1)%3;
        const dx=pts[b][0]-pts[a][0], dz=pts[b][2]-pts[a][2], len=Math.hypot(dx,dz);
        glow([(pts[a][0]+pts[b][0])/2,(pts[a][1]+pts[b][1])/2,(pts[a][2]+pts[b][2])/2],[len,0.10,0.55],col,inten*0.6,Math.atan2(dz,dx)); }
      pts.forEach(p=>FLOW.list.push({p,s:[2.6,2.6,2.6],c:col,me:inten,ro:1.0,orb:1})); };
    const triAt=(P,q,sc)=>{ const c=pathAt(P,Math.max(0,Math.min(1,q))); const r=sc||5.5;
      return [0,1,2].map(a=>{ const ang=a*2.094-1.57; return [c[0]+Math.cos(ang)*r, c[1], c[2]+Math.sin(ang)*r]; }); };
    if(step<2){ tri(triAt(Pv,(step+u)/2),FC.data,2.6); blockGlow(l2,20,14,FC.data,0.4); }
    else if(step<3){ blockGlow(smV,12,12,FC.data,1.0);
      const sp=triAt([smV,smV],0,4.0+2.0*Math.sin(u*6.28)); tri(sp,FC.data,2.6); }
    else if(step<4){ tri(triAt(Pr,u),FC.data,2.6); }
    else if(step<5){ blockGlow(ras,14,8,FC.px,1.0);
      gridObj([ras[0],ras[1]+2.6,ras[2]],0,7,5,1.6,(i,j)=>{ const on=(i+j*0.6)<u*10; return {col:FC.px,inten:on?1.9:0.10}; },1); }
    else if(step<6){ for(let i=0;i<4;i++) tileAlong(Pf(i),Math.min(1,u*1.1),3,2,FC.px,tk+i,1.5); }

  else if(kind==='hier'){

    else { lvl='数据返回'; const q=(step-12+u)/4; cyc=500+Math.round(60*q);
      if(q<0.25) tileAlong(rev(P3),q*4,8,4,FC.data,tk,1.4);
      else if(q<0.5) tileAlong(rev(P2),(q-0.25)*4,8,4,FC.data,tk,1.4);

    const disp=POS.city.disp, mc=POS.city.mc[1], gd=cp(14,-150,2.4), out=cp(160,-50,3.0);

    const Pg=routeMC2GDDR(0,-108,14);

    else if(step<3){ tileAlong(rev(Pg),Math.min(1,u*1.2),8,2,FC.px,row,1.5); blockGlow(mc,18,10,FC.px,0.5); }
    else { tileAlong(rev(Pq),u,8,2,FC.px,row,1.5); }
    // 出 die:像素一个接一个串行走向 DP 接口(4 条差分线)
    for(let i=0;i<14;i++){ const uu=((T*0.9)+i/14)%1; for(let l=0;l<4;l++) FLOW.list.push({p:[C0[0]+130+uu*30, C0[1]+1.2, C0[2]-50+(l-1.5)*2.2],s:[0.6,0.6,0.6],c:FC.px,me:2.2*(h1(i,l,row)>0.5?1:0.3),ro:1.0,orb:1}); }
    crossbarTraffic(T,4);
    const stage=['①显示引擎按扫描节拍发出"读第 N 行"','②控制器到显存取这一行','③像素行沿总线回来','④显示引擎把这一行串行送出 die'][step];
    FLOW.live.scan=`扫描行 <b>${row}</b> / 1080 · 第 ${step+1}/4 拍 · ${stage}`;
    FLOW.live.dispE=`显示引擎不算图,只按显示器的节拍搬:每 16.7 ms 把整张帧缓冲从头到尾读一遍<br>GPU 若在它读到一半时换帧 → 撕裂`;
  }
  else if(kind==='simt'){

    const tk=tick(), ph=phase();
    // 程序:12 拍一循环
    const prog=[
      {op:'LOAD  r1 ← x',mask:0xFFFF},{op:'MUL   r2 ← r1×2',mask:0xFFFF},{op:'ADD   r3 ← r2+1',mask:0xFFFF},{op:'STORE y ← r3',mask:0xFFFF},
      {op:'if (x > 0)  ← 求条件,产生掩码',mask:0xFFFF},
      {op:'路径 A · ADD',mask:0x00FF},{op:'路径 A · MUL',mask:0x00FF},{op:'路径 A · STORE',mask:0x00FF},
      {op:'路径 B · SUB',mask:0xFF00},{op:'路径 B · MUL',mask:0xFF00},{op:'路径 B · STORE',mask:0xFF00},

    lanes.forEach((p,l)=>{
      const on=active(l);

      // 每条通道头顶一格"寄存器":亮度 = 当前值;活跃通道每拍变一次
      const val=on?h1(tk,l):h1(tk-((step>=5&&step<=7&&!on)?1:0),l,9);
      pad([p[0],p[1]+1.05,p[2]],0.75,0.55,FC.data,0.25+1.1*val);
    });
    // 屏蔽的通道:头顶红叉(两条交叉短棒)
    lanes.forEach((p,l)=>{ if(active(l)) return;
      pad([p[0],p[1]+1.6,p[2]],0.9,0.16,[1.0,0.25,0.2],1.4,Math.PI/4);
      pad([p[0],p[1]+1.6,p[2]],0.9,0.16,[1.0,0.25,0.2],1.4,-Math.PI/4); });
    // 调度器亮
    glow(sched,[9.5,1.3,2.3],FC.cmd,0.10+0.55*Math.max(0,1-ph*3));
    // 实时数字
    const nAct=[...Array(16)].filter((_,l)=>active(l)).length;
    const divg=(step>=5&&step<=10);
    FLOW.live.sched=`第 ${step+1}/12 拍 · <b>${ins.op}</b><br>活跃通道 ${nAct}/16${divg?' · <span style="color:#ff8a80">分支发散:另一半在等</span>':''}`;

  else if(kind==='tensor'){

  else if(kind==='dp'){

    const px0=cp2(-1,3.6,9.6);                       // die 输出口

    const bitsOf=(v)=>[...Array(8)].map((_,i)=>(v>>(7-i))&1);
    const chans=[{v:R,c:[1.0,0.28,0.24],n:'R'},{v:G,c:[0.3,1.0,0.4],n:'G'},{v:B,c:[0.35,0.5,1.0],n:'B'}];
    // 一个"位"画成有厚度的小方块:亮=1,暗=0
    const bitBox=(x,y,z,on,col)=>glow([x,y,z],[2.6,1.5,1.5],col,on?2.4:0.16);
    if(step<2){
      // ① 一个像素从 die 出来:R/G/B 三行各 8 位,摞在一起
      const q=ease((step+u)/2);
      const p=V([100,9,-12],[136,9,-12],q);
      chans.forEach((ch,k)=>{ const bs=bitsOf(ch.v);
        for(let i=0;i<8;i++) bitBox(p[0]+(i-3.5)*3.2, p[1]+(1-k)*2.6, p[2], bs[i], ch.c); });
    } else if(step<4){
      // ② 编码器把 24 位重排成 4 条通道的串行流
      const fade=1-u*0.55;
      chans.forEach((ch,k)=>{ const bs=bitsOf(ch.v);
        for(let i=0;i<8;i++) glow([136+(i-3.5)*3.2, 9+(1-k)*2.6, -12],[2.6,1.5,1.5],ch.c,(bs[i]?2.4:0.16)*fade); });
      glow([150,7,-12],[14,3.0,14],FC.px,0.25+0.8*Math.max(0,1-Math.abs(u-0.5)*3));

            const on=(sgn>0)?bit:1-bit;

          }

      }
    }
    // 显示器一侧:收到的比特拼回像素,点亮屏幕上对应位置
    screenImage(T);
    const stage=['①一个像素从 die 出来:R/G/B 各 8 位','①三条 8 位一起走','②编码器重排成串行流','②加时钟恢复用的跳变','③4 对差分线并行往前送','③每对两根线,信号相反','③外界干扰同时加在两根上','③接收端做减法,干扰抵消','③24 位到齐','③显示器拼回这个像素'][step];
    FLOW.live.dp=`第 ${step+1}/10 拍 · <b>${stage}</b><br>本像素 R=${R} G=${G} B=${B}`;
    FLOW.live.pair=`一对 = 两根线,一根送原信号一根送反相<br>接收端看两根之差 → 共同的干扰被减掉`;
  }
  else if(kind==='lcd'){
    // ===== LCD:光带着"偏振方向"穿过五层,每层做一件事 =====
    const tk=tick(), ph=phase();
    const [LX,LY,LZ]=LCD_ORIGIN, st=POS.lcd.step, ly=POS.lcd.layerY;
    // 三列子像素:液晶转角不同 → 透光量不同
    const twist=[0.0, Math.PI/4, Math.PI/2];
    const passOf=(c)=>Math.pow(Math.sin(twist[c]),2);     // 马吕斯定律:透过率 = sin²(转角)
    const colOf=[[1.0,0.28,0.24],[0.3,1.0,0.4],[0.35,0.5,1.0]];
    // 背光整片
    glow([LX,LY+1.3,LZ],[63,0.02,43],[1.0,0.97,0.92],0.85);
    [-20,0,20].forEach((dx,c)=>{
      for(let k=0;k<8;k++){
        const u=((tk*0.5+ph)*0.42 + k/8 + c*0.09)%1;
        const y=LY+1.6+u*24.5;
        // 光柱走在所有层的正前方(z 比最前一层还靠前),整条都看得见
        const li=Math.max(0,Math.min(6,Math.floor((y-LY-1.0)/4.0)));

        const afterP1=y>LY+ly[1], afterLC=y>LY+ly[3], afterP2=y>LY+ly[5], afterCF=y>LY+ly[4];

        const ang = !afterP1 ? (k*1.1) : (afterLC ? twist[c] : 0.0);
        pad([p[0],p[1]-0.1,p[2]], 3.2, 0.30, cc, inten*0.75, ang);
      }
      // 出射面亮度 = 该列最终透光
      glow([LX+dx, LY+ly[6]+0.9, LZ+st*6],[18,0.10,38],colOf[c],0.12+1.5*passOf(c));
    });
    const names=['红:液晶不转 → 前偏光片全挡 → 这个子像素黑','绿:转 45° → 透一半 → 中等亮','蓝:转 90° → 全透 → 最亮'];
    FLOW.live.lcd=`马吕斯定律:透过率 = sin²(转角)<br>${names[tk%3]}`;
    FLOW.live.lc=`电压越大液晶转得越多 → 透光越多<br>每个子像素一个 TFT 开关管着自己的电压`;
  }
}
function screenImage(T){
  const cols=32, rows=18, cw=332/cols, ch=190/rows;
  const x=MON_X-6.4;
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const u=(i+0.5)/cols, v=(j+0.5)/rows;          // v: 0 顶 → 1 底
    // 天空到地面的渐变
    let c=[0.10+0.25*(1-v), 0.22+0.35*(1-v), 0.55+0.25*(1-v)];
    if(v>0.72) c=[0.10,0.12,0.09];
    // 一个三角形(顶点在上)
    const tx=Math.abs(u-0.5), ty=(v-0.20)/0.55;
    if(ty>0 && ty<1 && tx<ty*0.42) c=[1.0,0.42,0.72];
    const blink=0.85+0.15*Math.sin(T*2.0+i*0.3);
    FLOW.list.push({p:[x, 115+95-(j+0.5)*ch, -166+(i+0.5)*cw], s:[0.16,ch,cw], c, me:0.62*blink, ro:0.0, orb:0, flat:1});
  }
}
function renderFlow(){
  if(!FLOW.box||!lastVP) return;
  uploadInst(FLOW.box,  FLOW.list.filter(o=>!o.orb && !o.flat));
  uploadInst(FLOW.orb,  FLOW.list.filter(o=> o.orb));
  uploadInst(FLOW.flat, FLOW.list.filter(o=> o.flat));
  gl.bindFramebuffer(gl.FRAMEBUFFER,flow.fb); gl.viewport(0,0,W,H);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(false);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  gl.useProgram(PR.flow);
  gl.uniformMatrix4fv(PR.flow.u.uVP,false,lastVP);
  gl.uniform3fv(PR.flow.u.uCam,lastEye);
  for(const m of [FLOW.box,FLOW.orb,FLOW.flat]){ if(!m.count) continue;
    gl.bindVertexArray(m.vao);
    gl.drawElementsInstanced(gl.TRIANGLES,m.n,m.type,0,m.count); }
  gl.bindVertexArray(null);
  gl.disable(gl.BLEND); gl.disable(gl.CULL_FACE); gl.disable(gl.DEPTH_TEST); gl.depthMask(true);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  CHK('pass.flow');
}

  i=Math.max(0,Math.min(STATIONS.length-1,i)); cur=i;
  const st=STATIONS[i];
  const to={cam:Object.assign({},st.cam), state:Object.assign({lift:0,cutX:60},st.state)};
  cam.focus=st.cam.focus||'plane';
  const from=snapshot();
  let dAz=to.cam.az-from.cam.az;
  while(dAz>Math.PI) dAz-=2*Math.PI; while(dAz<-Math.PI) dAz+=2*Math.PI;
  to.cam.az=from.cam.az+dAz;
  labelsOn=false; buildLabels();
  if(instant){ applyPose(to); tween=null; labelsOn=true; }
  else tween={t0:performance.now(), dur:1700, from, to};
  renderUI(); reset();
}
function stepTween(now){
  if(!tween) return false;
  let t=(now-tween.t0)/tween.dur;
  if(t>=1){ applyPose(tween.to); tween=null; labelsOn=true; reset(); return false; }
  const e=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const f=tween.from, o=tween.to;
  applyPose({
    cam:{ tgt:[lerp(f.cam.tgt[0],o.cam.tgt[0],e),lerp(f.cam.tgt[1],o.cam.tgt[1],e),lerp(f.cam.tgt[2],o.cam.tgt[2],e)],
          az:lerp(f.cam.az,o.cam.az,e), el:lerp(f.cam.el,o.cam.el,e),
          dist:Math.exp(lerp(Math.log(f.cam.dist),Math.log(o.cam.dist),e)),
          fov:lerp(f.cam.fov,o.cam.fov,e), ap:lerp(f.cam.ap,o.cam.ap,e), fy:lerp(f.cam.fy,o.cam.fy,e), ex:lerp(f.cam.ex,o.cam.ex,e) },
    state:{ lift:lerp(f.state.lift,o.state.lift,e), cutX:lerp(f.state.cutX,o.state.cutX,e) }
  });
  reset(); return true;
}
// —— 标签层:HTML 元素按 3D 锚点投影定位,SVG 画引线 ——
const labelEls=[];
function resolveAnchor(p){
  let a = (typeof p==='string') ? POS[p] : (Array.isArray(p)&&typeof p[0]==='string') ? POS[p[0]][p[1]] : p;
  if(!a) return null;
  if(Array.isArray(a[0])) a=a[Math.floor(a.length/2)];
  return a;
}
function buildLabels(){
  const box=$('labels'), svg=$('leaders');
  box.innerHTML=''; svg.innerHTML=''; labelEls.length=0;
  for(const lb of (STATIONS[cur].labels||[])){
    const p=resolveAnchor(lb.p); if(!p) continue;
    const el=document.createElement('div'); el.className='lb';
    el.innerHTML=lb.t+(lb.s?'<small>'+lb.s+'</small>':'');
    box.appendChild(el);
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('stroke','rgba(120,180,245,.75)'); ln.setAttribute('stroke-width','1.2');
    svg.appendChild(ln);
    labelEls.push({el,ln,p,dy:lb.dy||-34,live:lb.live||null,base:lb.t+(lb.s?'<small>'+lb.s+'</small>':''),last:null});
  }
}
function updateLabels(){
  if(!labelEls.length) return;
  const vp=camMats(0).vp, cw=cv.clientWidth, ch=cv.clientHeight;
  for(const L of labelEls){
    const [x,y,z]=L.p;
    const w=vp[3]*x+vp[7]*y+vp[11]*z+vp[15];
    if(w<=0.01){ L.el.classList.remove('show'); L.ln.setAttribute('opacity','0'); continue; }
    const sx=((vp[0]*x+vp[4]*y+vp[8]*z+vp[12])/w*0.5+0.5)*cw;
    const sy=(1-((vp[1]*x+vp[5]*y+vp[9]*z+vp[13])/w*0.5+0.5))*ch;
    const on=labelsOn && sx>-50 && sx<cw+50 && sy>-50 && sy<ch+50;
    if(L.live && FLOW.live && FLOW.live[L.live]!=null && FLOW.live[L.live]!==L.last){
      L.last=FLOW.live[L.live]; L.el.innerHTML=L.base.replace(/<small>.*<\/small>/,'')+'<small>'+L.last+'</small>'; }
    L.el.style.left=sx+'px'; L.el.style.top=(sy+L.dy)+'px';
    L.el.classList.toggle('show',on);
    L.ln.setAttribute('x1',sx); L.ln.setAttribute('y1',sy);
    L.ln.setAttribute('x2',sx); L.ln.setAttribute('y2',sy+L.dy+4);
    L.ln.setAttribute('opacity',on?'1':'0');
  }
}
// —— UI ——
function renderUI(){
  const st=STATIONS[cur];
  document.querySelectorAll('#acts button').forEach((b,k)=>b.classList.toggle('on',k===st.act));
  document.querySelectorAll('#stations button').forEach((b,k)=>{
    b.classList.toggle('on',k===cur); b.classList.toggle('done',k<cur); });
  $('cK').textContent=ACTS[st.act]+' · '+String(cur+1).padStart(2,'0')+' / '+STATIONS.length;
  $('cT').textContent=st.title;
  $('cB').innerHTML=st.body;
  $('bPrev').disabled=(cur===0);
  $('clk').classList.toggle('on', !!st.flow);
  $('bNext').textContent=(cur===STATIONS.length-1)?'回到开头 ↺':'下一站 →';
  const sl=$('hAp'); if(sl) sl.value=50;
  const ts=$('hTs'); if(ts) ts.checked=(cam.focus==='plane');
}
function buildUI(){
  const acts=$('acts');
  ACTS.forEach((n,i)=>{ const b=document.createElement('button'); b.textContent=n;
    b.onclick=()=>goTo(STATIONS.findIndex(s=>s.act===i)); acts.appendChild(b); });
  const sts=$('stations');
  STATIONS.forEach((s,i)=>{ const b=document.createElement('button'); b.textContent=i+1; b.title=s.title;
    b.onclick=()=>goTo(i); sts.appendChild(b); });
  $('bPrev').onclick=()=>goTo(cur-1);
  $('bNext').onclick=()=>goTo((cur+1)%STATIONS.length);
  const gl_=$('gList');
  GLOSSARY.forEach(([en,zh,ex])=>{ const dt=document.createElement('dt'); dt.innerHTML=en+'<span>'+zh+'</span>';
    const dd=document.createElement('dd'); dd.textContent=ex; gl_.appendChild(dt); gl_.appendChild(dd); });
  $('gBtn').onclick=()=>$('gPanel').classList.toggle('open');
  $('gClose').onclick=()=>$('gPanel').classList.remove('open');
  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight'||e.key==='PageDown'){ goTo(Math.min(cur+1,STATIONS.length-1)); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ goTo(Math.max(cur-1,0)); }
    else if(e.key==='Escape'){ $('gPanel').classList.remove('open'); }
  });
  $('cPlay').onclick=()=>{ CLK.playing=!CLK.playing; $('cPlay').textContent=CLK.playing?'⏸':'▶'; };
  $('cStep').onclick=()=>{ CLK.playing=false; $('cPlay').textContent='▶'; CLK.t=Math.floor(CLK.t)+1; };
  $('cSpd').addEventListener('input',e=>{ CLK.speed=e.target.value/100; });
  $('hAp').addEventListener('input',e=>{ cam.ap=STATIONS[cur].cam.ap*(e.target.value/50); reset(); });
  $('hTs').addEventListener('change',e=>{ cam.focus=e.target.checked?'plane':'point'; reset(); });
}
// —— 鼠标:接管相机时取消缓动 ——
let drag=null;
cv.addEventListener('mousedown',e=>{ drag={x:e.clientX,y:e.clientY,btn:e.button}; tween=null; labelsOn=true; e.preventDefault(); });
window.addEventListener('mouseup',()=>drag=null);
window.addEventListener('mousemove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.x=e.clientX; drag.y=e.clientY;
  if(drag.btn===2||e.shiftKey){
    const rx=Math.cos(cam.az), rz=-Math.sin(cam.az), k=cam.dist*0.0016;
    cam.tgt[0]-=dx*rx*k; cam.tgt[2]-=dx*rz*k; cam.tgt[1]+=dy*k;
  } else {
    cam.az-=dx*0.0052; cam.el=Math.max(0.02,Math.min(1.52,cam.el+dy*0.0042));
  }
  reset();
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{ e.preventDefault(); tween=null;
  cam.dist=Math.max(4,Math.min(700,cam.dist*Math.exp(e.deltaY*0.0011))); reset(); },{passive:false});
window.addEventListener('resize',resize);

//==============================================================
// S14 · 启动 + 主循环
//==============================================================
let ATLAS_TEX=null;
function boot(){
  PR.gb     = prog(GB_VS, GB_FS, 'gbuffer');
  PR.shadow = prog(SHADOW_VS, SHADOW_FS, 'shadow');
  PR.ssao   = prog(FS_VS, SSAO_FS, 'ssao');
  PR.blur   = prog(FS_VS, BLUR_FS, 'aoblur');
  PR.light  = prog(FS_VS, LIGHT_FS, 'lighting');
  PR.copy   = prog(FS_VS, COPY_FS, 'copy');
  PR.bright = prog(FS_VS, BRIGHT_FS, 'bright');
  PR.gauss  = prog(FS_VS, GAUSS_FS, 'gauss');
  PR.post   = prog(FS_VS, POST_FS, 'post');
  PR.flow   = prog(FLOW_VS, FLOW_FS, 'flow');
  PR.combine= prog(FS_VS, COMBINE_FS, 'combine');
  CHK('boot.programs');
  ATLAS_TEX=buildAtlas();        CHK('boot.atlas');
  bakeEnvironment();             CHK('boot.env');
  buildScene();                  CHK('boot.scene');
  FLOW.box=makeMesh(roundedBox(1,1,1,0.08,2),1600);
  FLOW.orb=makeMesh(roundedBox(1,1,1,0.5,5),400);
  FLOW.flat=makeMesh(roundedBox(1,1,1,0.002,1),9000);
  totalTris=SCENE.reduce((a,m)=>a+m.tris*m.count,0);
  shadow=mkShadow();             CHK('boot.shadow');
  resize();                      CHK('boot.resize');
  buildUI();
  goTo(0,true);
  requestAnimationFrame(loop);
}
let fpsAcc=0, fpsN=0;
let REC=false;
function loop(now){
  if(REC) return;                    // 录制模式:不自排 rAF,完全由外部驱动
  const t0=performance.now();
  stepTween(now); clockStep(now);
  if(spp<QUAL.maxSPP){ renderSample(spp); spp++; dirty=true; }
  const fl=STATIONS[cur].flow;
  if(fl && lastVP && labelsOn){ buildFlow(fl, now/1000); renderFlow(); FLOW.on=1; dirty=true; }
  else FLOW.on=0;
  // 累积中图变化极小:每 3 帧才做一次泛光 + 后期,省掉大头
  if(dirty){
    const acc = spp<QUAL.maxSPP;
    if(!acc || spp<4 || (spp%3)===0 || FLOW.on) composite();
    dirty = acc;
  }
  updateLabels();
  const dt=performance.now()-t0; fpsAcc+=dt; fpsN++;
  if(fpsN>=20){ lastMs=fpsAcc/fpsN; fpsAcc=0; fpsN=0; }
  $('hSpp').textContent=spp+' / '+QUAL.maxSPP;
  $('hMs').textContent=lastMs?lastMs.toFixed(1)+' ms':'—';
  $('hTri').textContent=(drawnTris/2/1000).toFixed(0)+' / '+(totalTris/1000).toFixed(0)+' K';
  $('hFst').textContent=cam.ap<0.001?'关(全清晰)':cam.ap.toFixed(2);
  $('hBar').style.width=(100*spp/QUAL.maxSPP).toFixed(1)+'%';
  $('cTick').textContent='拍 '+tick();
  requestAnimationFrame(loop);
}
// 自动化检查 / 录制钩子
window.__hw3d={
  caps:()=>({webgl2:true, colorFloat:CAPS.colorFloat, floatLinear:CAPS.floatLinear, aniso:MAXANISO,
    passes:['shadow','gbuffer','ssao','ibl-lighting','accum','bloom','post'],
    envSize:ENV_SIZE, envMips:ENV_MIPS, tris:totalTris, stations:STATIONS.length}),
  spp:()=>spp, maxSpp:()=>QUAL.maxSPP, converged:()=>spp>=QUAL.maxSPP && !tween,
  busy:()=>!!tween, cur:()=>cur,
  go:(i,instant)=>goTo(i,!!instant),
  setSpp:(n)=>{QUAL.maxSPP=n; reset();},
  errs:()=>GLERR.slice(),
  glError:()=>{ const e=[]; for(let k=0;k<8;k++){ const x=gl.getError(); if(x===0) break; e.push('0x'+x.toString(16)); } return e; }
};
// —— 录制钩子:进站先把静态底图跑满采样定住,之后每帧只重画数据流层 ——
window.__rec={
  begin(){ REC=true; CLK.playing=false; },
  end(){ REC=false; requestAnimationFrame(loop); },
  // 跳到第 i 站并累积 n 次采样(底图从此不再变)
  enter(i,n){
    goTo(i,true); tween=null; labelsOn=true;
    spp=0;
    for(let k=0;k<(n||64);k++){ renderSample(k); spp=k+1; }
    updateLabels();
    return {station:i, spp};
  },
  // 渲染第 t 秒的一帧(只更新数据流层 + 合成)
  frame(t){
    CLK.t=t*CLK.tps;
    const fl=STATIONS[cur].flow;
    if(fl){ buildFlow(fl,t); renderFlow(); FLOW.on=1; } else FLOW.on=0;
    composite(); updateLabels();
  },
  stations(){ return STATIONS.map((s,i)=>({i, act:s.act, title:s.title, flow:s.flow||null})); }
};
window.__setProgress=(p)=>{ goTo(Math.min(STATIONS.length-1, Math.floor(p*STATIONS.length)), true); };
try{ boot(); }
catch(err){ console.error(err);
  if(!document.getElementById('err').style.display) fatal('初始化失败：'+(err&&err.message?err.message:err)); }
</script>
