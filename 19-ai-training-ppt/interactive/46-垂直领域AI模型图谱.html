<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>垂直领域 AI 模型图谱 — 各行各业的 AI 专家</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0a0e1a;
  --surface: #111827;
  --surface-light: #1e293b;
  --border: rgba(148, 163, 184, 0.12);
  --text: #e2e8f0;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --sidebar-w: 220px;
  --header-h: 72px;
  --cat-video: #ef4444;
  --cat-image: #f97316;
  --cat-music: #eab308;
  --cat-voice: #22c55e;
  --cat-code: #3b82f6;
  --cat-search: #6366f1;
  --cat-medical: #ec4899;
  --cat-design: #a855f7;
  --cat-robotics: #64748b;
  --cat-science: #14b8a6;
  --cat-3d: #f43f5e;
  --cat-translation: #06b6d4;
}

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ============ STARS ============ */
.stars-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  animation: twinkle var(--dur) ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: var(--omin); }
  50% { opacity: var(--omax); }
}

/* ============ HEADER ============ */
.header {
  position: relative;
  z-index: 20;
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  border-bottom: 1px solid var(--border);
  background: rgba(10, 14, 26, 0.85);
  backdrop-filter: blur(12px);
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.header h1 {
  font-size: 22px;
  font-weight: 900;
  background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.header-subtitle {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 400;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.search-box {
  position: relative;
}

.search-box input {
  background: rgba(30, 41, 59, 0.7);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 7px 16px 7px 36px;
  color: var(--text);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  width: 220px;
  outline: none;
  transition: border-color 0.3s, width 0.3s;
}

.search-box input:focus {
  border-color: rgba(139, 92, 246, 0.5);
  width: 280px;
}

.search-box input::placeholder {
  color: var(--text-dim);
}

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 14px;
  pointer-events: none;
}

.btn-overview {
  padding: 7px 18px;
  border: 1px solid rgba(148, 163, 184, 0.25);
  border-radius: 20px;
  background: rgba(30, 41, 59, 0.6);
  color: var(--text-muted);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  backdrop-filter: blur(8px);
  white-space: nowrap;
}

.btn-overview:hover {
  border-color: rgba(148, 163, 184, 0.5);
  color: var(--text);
}

.btn-overview.active {
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(168, 85, 247, 0.3));
  border-color: rgba(139, 92, 246, 0.6);
  color: #fff;
}

.model-count-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text-dim);
  background: rgba(30, 41, 59, 0.6);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px 10px;
  white-space: nowrap;
}

/* ============ MAIN LAYOUT ============ */
.main-layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
  z-index: 10;
}

/* ============ SIDEBAR ============ */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  background: rgba(17, 24, 39, 0.5);
  backdrop-filter: blur(12px);
  overflow-y: auto;
  padding: 12px 0;
}

.sidebar::-webkit-scrollbar {
  width: 4px;
}

.sidebar::-webkit-scrollbar-thumb {
  background: rgba(148, 163, 184, 0.2);
  border-radius: 2px;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  border-left: 3px solid transparent;
}

.sidebar-item:hover {
  background: rgba(148, 163, 184, 0.06);
}

.sidebar-item.active {
  background: rgba(148, 163, 184, 0.08);
}

.sidebar-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  border-radius: 0 2px 2px 0;
  background: transparent;
  transition: background 0.25s;
}

.sidebar-item.active::before {
  background: var(--accent);
}

.sidebar-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  transition: transform 0.25s;
}

.sidebar-item:hover .sidebar-icon {
  transform: scale(1.1);
}

.sidebar-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  transition: color 0.25s;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.sidebar-item.active .sidebar-label {
  color: var(--text);
  font-weight: 600;
}

.sidebar-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  background: rgba(30, 41, 59, 0.6);
  border-radius: 8px;
  padding: 2px 6px;
  min-width: 20px;
  text-align: center;
}

/* ============ CONTENT AREA ============ */
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  position: relative;
}

.content-area::-webkit-scrollbar {
  width: 6px;
}

.content-area::-webkit-scrollbar-thumb {
  background: rgba(148, 163, 184, 0.15);
  border-radius: 3px;
}

/* ============ OVERVIEW GRID ============ */
.overview-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  max-width: 1100px;
  margin: 0 auto;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.overview-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px 20px;
  cursor: pointer;
  transition: all 0.35s ease;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 12px;
}

.overview-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0;
  transition: opacity 0.35s;
  pointer-events: none;
}

.overview-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 0 1px var(--accent);
}

.overview-card:hover::before {
  opacity: 1;
}

.overview-icon {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  transition: transform 0.35s;
}

.overview-card:hover .overview-icon {
  transform: scale(1.12) rotate(-3deg);
}

.overview-name {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.overview-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 26px;
  font-weight: 600;
  color: var(--accent);
}

.overview-count-label {
  font-size: 12px;
  color: var(--text-dim);
  margin-top: -6px;
}

.overview-leader {
  font-size: 11px;
  color: var(--text-muted);
  background: rgba(148, 163, 184, 0.08);
  border-radius: 8px;
  padding: 4px 10px;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ============ CATEGORY DETAIL VIEW ============ */
.category-view {
  animation: fadeIn 0.4s ease;
  max-width: 1100px;
  margin: 0 auto;
}

.category-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.category-header-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
}

.category-header-text h2 {
  font-size: 24px;
  font-weight: 800;
  color: var(--text);
}

.category-header-text p {
  font-size: 13px;
  color: var(--text-dim);
  margin-top: 2px;
}

.model-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.model-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px 20px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.model-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 3px;
  background: var(--accent);
  opacity: 0;
  transition: opacity 0.3s;
}

.model-card:hover {
  transform: translateY(-3px);
  border-color: rgba(148, 163, 184, 0.25);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
}

.model-card:hover::after {
  opacity: 1;
}

.model-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.model-name {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}

.model-company {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 400;
  margin-top: 1px;
}

.model-badge {
  flex-shrink: 0;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 10px;
  white-space: nowrap;
}

.badge-leader {
  background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), rgba(245, 158, 11, 0.15));
  color: #fbbf24;
  border: 1px solid rgba(251, 191, 36, 0.3);
}

.badge-category {
  background: rgba(96, 165, 250, 0.12);
  color: #60a5fa;
  border: 1px solid rgba(96, 165, 250, 0.25);
}

.model-desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.model-card-footer {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

.model-tag {
  font-size: 10px;
  font-weight: 600;
  color: var(--accent);
  background: rgba(var(--accent-rgb), 0.1);
  border: 1px solid rgba(var(--accent-rgb), 0.2);
  border-radius: 6px;
  padding: 2px 8px;
  letter-spacing: 0.3px;
}

/* ============ SEARCH RESULTS ============ */
.search-results {
  animation: fadeIn 0.3s ease;
  max-width: 1100px;
  margin: 0 auto;
}

.search-results-title {
  font-size: 16px;
  color: var(--text-muted);
  margin-bottom: 20px;
}

.search-results-title strong {
  color: var(--text);
}

.search-highlight {
  background: rgba(251, 191, 36, 0.25);
  color: #fbbf24;
  border-radius: 2px;
  padding: 0 2px;
}

/* ============ MODAL ============ */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: all;
}

.modal-card {
  background: linear-gradient(135deg, #1e293b, #0f172a);
  border: 1px solid rgba(148, 163, 184, 0.15);
  border-radius: 18px;
  padding: 32px;
  max-width: 480px;
  width: 92%;
  position: relative;
  transform: scale(0.9) translateY(20px);
  transition: transform 0.3s ease;
  box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
  max-height: 85vh;
  overflow-y: auto;
}

.modal-card::-webkit-scrollbar {
  width: 4px;
}

.modal-card::-webkit-scrollbar-thumb {
  background: rgba(148, 163, 184, 0.2);
  border-radius: 2px;
}

.modal-overlay.active .modal-card {
  transform: scale(1) translateY(0);
}

.modal-close {
  position: absolute;
  top: 14px;
  right: 18px;
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 24px;
  cursor: pointer;
  line-height: 1;
  transition: color 0.2s;
  z-index: 2;
}

.modal-close:hover {
  color: var(--text);
}

.modal-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 20px;
}

.modal-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
}

.modal-title {
  font-size: 22px;
  font-weight: 800;
}

.modal-company-text {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 400;
  margin-top: 2px;
}

.modal-badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 10px;
  margin-bottom: 18px;
}

.modal-section {
  margin-bottom: 16px;
}

.modal-section-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 10px;
}

.modal-capability-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.modal-capability-list li {
  font-size: 14px;
  color: var(--text-muted);
  padding-left: 18px;
  position: relative;
  line-height: 1.5;
}

.modal-capability-list li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 7px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.6;
}

.modal-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.modal-tag {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  background: rgba(30, 41, 59, 0.6);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 10px;
}

/* ============ RESPONSIVE ============ */
@media (max-width: 1100px) {
  .overview-grid {
    grid-template-columns: repeat(3, 1fr);
  }
  .model-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 860px) {
  .sidebar { display: none; }
  .overview-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .model-grid {
    grid-template-columns: repeat(2, 1fr);
  }
  .header h1 { font-size: 18px; }
  .search-box input { width: 160px; }
  .search-box input:focus { width: 200px; }
}

@media (max-width: 600px) {
  .overview-grid {
    grid-template-columns: 1fr;
  }
  .model-grid {
    grid-template-columns: 1fr;
  }
  .header { padding: 0 14px; }
  .content-area { padding: 16px; }
}
</style>
</head>
<body>

<!-- Stars -->
<div class="stars-container" id="stars"></div>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div>
      <h1>垂直领域 AI 模型图谱</h1>
      <div class="header-subtitle">各行各业的 AI 专家 &mdash; 2026.03</div>

</div>

<!-- Main -->
<div class="main-layout">
  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar"></nav>
  <!-- Content -->
  <main class="content-area" id="content"></main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

const TOTAL_MODELS = CATEGORIES.reduce((s, c) => s + c.models.length, 0);

// ============ STATE ============
let currentView = 'overview'; // 'overview' | 'category' | 'search' | 'all'
let currentCategoryId = null;

// ============ STARS ============
function createStars() {
  const container = document.getElementById('stars');
  const fragment = document.createDocumentFragment();
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2 + 0.5;
    star.style.cssText = `
      width:${size}px;height:${size}px;
      top:${Math.random()*100}%;left:${Math.random()*100}%;
      --dur:${Math.random()*4+2}s;
      --omin:${Math.random()*0.2+0.05};
      --omax:${Math.random()*0.5+0.3};
    `;
    fragment.appendChild(star);
  }
  container.appendChild(fragment);
}

// ============ SIDEBAR ============
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  const html = CATEGORIES.map(cat => `
    <div class="sidebar-item${currentCategoryId === cat.id ? ' active' : ''}"
         data-cat="${cat.id}"
         style="--accent:${cat.color}">
      <div class="sidebar-icon" style="background:${cat.color}20;color:${cat.color}">${cat.icon}</div>
      <span class="sidebar-label">${cat.name}</span>
      <span class="sidebar-count">${cat.models.length}</span>
    </div>
  `).join('');
  sidebar.innerHTML = html;

  sidebar.querySelectorAll('.sidebar-item').forEach(item => {
    item.addEventListener('click', () => {
      const catId = item.dataset.cat;
      showCategory(catId);
    });
  });
}

// ============ OVERVIEW ============
function renderOverview() {
  currentView = 'overview';
  currentCategoryId = null;
  updateButtons();
  renderSidebar();

  const content = document.getElementById('content');
  const cards = CATEGORIES.map((cat, i) => {
    const leader = cat.models.find(m => m.badgeType === 'leader');
    return `
      <div class="overview-card" data-cat="${cat.id}"
           style="--accent:${cat.color};animation-delay:${i * 0.04}s"
           onmouseenter="this.style.borderColor='${cat.color}'"
           onmouseleave="this.style.borderColor=''">
        <div class="overview-card__bg" style="position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 50% 0%,${cat.color}08,transparent 70%);pointer-events:none"></div>
        <div class="overview-icon" style="background:${cat.color}18;color:${cat.color}">${cat.icon}</div>
        <div class="overview-name">${cat.name}</div>
        <div class="overview-count" style="color:${cat.color}">${cat.models.length}</div>
        <div class="overview-count-label">个模型</div>
        ${leader ? `<div class="overview-leader">${leader.name} — ${leader.badge}</div>` : ''}
      </div>
    `;
  }).join('');

  content.innerHTML = `<div class="overview-grid">${cards}</div>`;

  content.querySelectorAll('.overview-card').forEach(card => {
    card.addEventListener('click', () => showCategory(card.dataset.cat));
  });
}

// ============ CATEGORY VIEW ============
function showCategory(catId) {
  const cat = CATEGORIES.find(c => c.id === catId);
  if (!cat) return;

  currentView = 'category';
  currentCategoryId = catId;
  updateButtons();
  renderSidebar();

  const content = document.getElementById('content');
  const modelCards = cat.models.map((m, i) => renderModelCard(m, cat, i)).join('');

  content.innerHTML = `
    <div class="category-view">
      <div class="category-header">
        <div class="category-header-icon" style="background:${cat.color}18;color:${cat.color}">${cat.icon}</div>
        <div class="category-header-text">
          <h2 style="color:${cat.color}">${cat.name}</h2>
          <p>${cat.desc} &mdash; ${cat.models.length} 个模型</p>
        </div>
      </div>
      <div class="model-grid">${modelCards}</div>
    </div>
  `;

  bindModelCardClicks(cat);
}

function renderModelCard(m, cat, index) {
  const badgeClass = m.badgeType === 'leader' ? 'badge-leader' : 'badge-category';
  const proCon = (m.pros && m.cons)
    ? `<div style="font-size:11px;line-height:1.5;margin-top:2px;display:flex;gap:6px;flex-wrap:wrap">
        <span style="color:#4ade80">+${m.pros[0]}</span>
        <span style="color:#f87171">-${m.cons[0]}</span>
      </div>`
    : '';
  return `
    <div class="model-card" data-model="${m.name}" style="--accent:${cat.color};--accent-rgb:${cat.rgb};animation-delay:${index * 0.05}s">
      <div class="model-card-top">
        <div>
          <div class="model-name">${m.name}</div>
          <div class="model-company">${m.company}</div>
        </div>
        <span class="model-badge ${badgeClass}">${m.badge}</span>
      </div>
      <div class="model-desc">${m.desc}</div>
      ${proCon}
      <div class="model-card-footer">
        ${m.tags.slice(0, 3).map(t => `<span class="model-tag" style="color:${cat.color};background:${cat.color}12;border-color:${cat.color}30">${t}</span>`).join('')}
      </div>
    </div>
  `;
}

function bindModelCardClicks(cat) {
  document.querySelectorAll('.model-card').forEach(card => {
    card.addEventListener('click', () => {
      const modelName = card.dataset.model;
      const model = cat.models.find(m => m.name === modelName);
      if (model) openModal(model, cat);
    });
  });
}

// ============ ALL MODELS VIEW ============
function renderAllModels() {
  currentView = 'all';
  currentCategoryId = null;
  updateButtons();
  renderSidebar();

  const content = document.getElementById('content');
  let html = '<div class="category-view">';
  html += '<div class="category-header"><div class="category-header-text"><h2>全部模型</h2><p>按领域分类 &mdash; 共 ' + TOTAL_MODELS + ' 个模型</p></div></div>';

  CATEGORIES.forEach(cat => {
    html += `<div style="margin-bottom:32px">`;
    html += `<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <span style="font-size:20px">${cat.icon}</span>
      <span style="font-size:16px;font-weight:700;color:${cat.color}">${cat.name}</span>
      <span style="font-size:12px;color:var(--text-dim)">${cat.models.length} 个模型</span>
    </div>`;
    html += `<div class="model-grid">${cat.models.map((m, i) => renderModelCard(m, cat, i)).join('')}</div>`;
    html += `</div>`;
  });

  html += '</div>';
  content.innerHTML = html;

  // Bind clicks for all categories
  CATEGORIES.forEach(cat => {
    document.querySelectorAll(`.model-card`).forEach(card => {
      const modelName = card.dataset.model;
      const model = cat.models.find(m => m.name === modelName);
      if (model && !card._bound) {
        card._bound = true;
        card.addEventListener('click', () => openModal(model, cat));
      }
    });
  });
}

// ============ SEARCH ============
function performSearch(query) {
  if (!query.trim()) {
    renderOverview();
    return;
  }

  currentView = 'search';
  currentCategoryId = null;
  updateButtons();
  renderSidebar();

  const q = query.toLowerCase();
  const results = [];
  CATEGORIES.forEach(cat => {
    cat.models.forEach(m => {
      const searchText = `${m.name} ${m.company} ${m.desc} ${m.badge} ${m.tags.join(' ')}`.toLowerCase();
      if (searchText.includes(q)) {
        results.push({ model: m, category: cat });
      }
    });
  });

  const content = document.getElementById('content');
  if (results.length === 0) {
    content.innerHTML = `
      <div class="search-results">
        <div class="search-results-title">未找到匹配 "<strong>${escapeHtml(query)}</strong>" 的模型</div>
        <div style="color:var(--text-dim);font-size:14px;margin-top:12px">试试其他关键词，如 "OpenAI"、"开源"、"视频"</div>
      </div>
    `;
    return;
  }

  let html = `
    <div class="search-results">
      <div class="search-results-title">找到 <strong>${results.length}</strong> 个匹配 "<strong>${escapeHtml(query)}</strong>" 的模型</div>
      <div class="model-grid">
  `;

  results.forEach(({ model, category }, i) => {
    html += renderModelCard(model, category, i);
  });

  html += '</div></div>';
  content.innerHTML = html;

  // Bind clicks
  results.forEach(({ model, category }) => {
    document.querySelectorAll(`.model-card`).forEach(card => {
      if (card.dataset.model === model.name && !card._bound) {
        card._bound = true;
        card.addEventListener('click', () => openModal(model, category));
      }
    });
  });
}

// ============ MODAL ============
function openModal(model, cat) {
  const modal = document.getElementById('modal');
  const body = document.getElementById('modalBody');
  const badgeClass = model.badgeType === 'leader' ? 'badge-leader' : 'badge-category';

  const prosHtml = (model.pros && model.pros.length > 0)
    ? `<div class="modal-section">
        <h4 style="color:#4ade80;font-size:13px;font-weight:700;margin-bottom:10px">&#9989; 优点</h4>
        <ul class="modal-capability-list" style="--accent:#4ade80">
          ${model.pros.map(p => `<li>${p}</li>`).join('')}
        </ul>
      </div>`
    : '';

  const consHtml = (model.cons && model.cons.length > 0)
    ? `<div class="modal-section">
        <h4 style="color:#f87171;font-size:13px;font-weight:700;margin-bottom:10px">&#9888;&#65039; 不足</h4>
        <ul class="modal-capability-list" style="--accent:#f87171">
          ${model.cons.map(c => `<li>${c}</li>`).join('')}
        </ul>
      </div>`
    : '';

  body.innerHTML = `
    <div class="modal-header">
      <div class="modal-icon" style="background:${cat.color}20;color:${cat.color};font-size:26px;display:flex;align-items:center;justify-content:center">${cat.icon}</div>
      <div>
        <div class="modal-title">${model.name}</div>
        <div class="modal-company-text">${model.company} &bull; ${cat.name}</div>
      </div>
    </div>
    <div class="modal-badge ${badgeClass}">${model.badge}</div>
    <div class="modal-section">
      <div class="modal-section-title">核心能力</div>
      <ul class="modal-capability-list" style="--accent:${cat.color}">
        ${model.capabilities.map(c => `<li>${c}</li>`).join('')}
      </ul>
    </div>
    ${prosHtml}
    ${consHtml}
    <div class="modal-section">
      <div class="modal-section-title">标签</div>
      <div class="modal-tags">
        ${model.tags.map(t => `<span class="modal-tag">${t}</span>`).join('')}
      </div>
    </div>
    <div class="modal-section" style="margin-bottom:0">
      <div class="modal-section-title">简介</div>
      <div style="font-size:14px;color:var(--text-muted);line-height:1.6">${model.desc}</div>
    </div>
  `;

  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

// ============ BUTTONS ============
function updateButtons() {
  const btnOv = document.getElementById('btnOverview');
  const btnAll = document.getElementById('btnAll');
  btnOv.classList.toggle('active', currentView === 'overview');
  btnAll.classList.toggle('active', currentView === 'all');
}

// ============ UTILS ============
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============ INIT ============
function init() {
  createStars();

  document.getElementById('totalBadge').textContent = TOTAL_MODELS + ' 个模型';

  renderOverview();

  // Sidebar clicks handled in renderSidebar()

  // Overview button
  document.getElementById('btnOverview').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    renderOverview();
  });

  // All button
  document.getElementById('btnAll').addEventListener('click', () => {
    document.getElementById('searchInput').value = '';
    renderAllModels();
  });

  // Search
  let searchTimer = null;
  document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      performSearch(e.target.value);
    }, 250);
  });

  // Modal close
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
}

init();
</script>
